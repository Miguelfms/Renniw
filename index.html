<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14120c">
<meta name="description" content="Renniw: atletas, partidas, torneios e ligas de futebol 1x1.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Renniw">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/renniw-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renniw</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;600;700&display=swap">
<style>
  /* Layout: menu lateral no computador, barra inferior no celular; conteúdo em uma coluna de leitura.
     Linguagem visual: giz sobre gramado, com marcações de campo e placar de estádio. */
  :root {
    --bg: #edf0e8;
    --surface: #f7f9f3;
    --surface-2: #e2e9db;
    --ink: #13241a;
    --muted: #566a5c;
    --line: #c7d1c0;
    --accent: #1d7a45;
    --accent-ink: #ffffff;
    --signal: #b93e14;
    --scrim: rgba(10, 20, 14, .55);
    --font-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
    --font-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --nav-h: 60px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1913; --surface: #16241b; --surface-2: #1e3023; --ink: #e4eee2;
      --muted: #93ab98; --line: #2a4231; --accent: #5ccf88; --accent-ink: #06210f;
      --signal: #ff9460; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1913; --surface: #16241b; --surface-2: #1e3023; --ink: #e4eee2;
    --muted: #93ab98; --line: #2a4231; --accent: #5ccf88; --accent-ink: #06210f;
    --signal: #ff9460; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
  }
  a { color: inherit; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: block; max-width: 1040px; margin: 0 auto; }
  .view { min-width: 0; max-width: 760px; }

  /* ---------- Início (cartões, no estilo do Meu Xadrez) ---------- */
  .hm-hero { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px 24px; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--surface-2), var(--surface)); }
  .hm-hero::before { content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent 0 56px, color-mix(in srgb, var(--accent) 9%, transparent) 56px 112px); }
  .hm-hero > * { position: relative; }
  .hm-eyebrow { display: block; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .hm-titulo { font-size: clamp(34px, 8vw, 52px); margin: 0 0 8px; }
  .hm-titulo em { font-style: italic; color: var(--accent); }
  .hm-hero p { color: var(--muted); max-width: 52ch; margin: 0 0 16px; }
  .hm-btn { min-height: 46px; padding-inline: 22px; font-weight: 700; }
  .hm-sec { margin-top: 26px; }
  .hm-h { margin: 0; color: var(--accent); }
  .hm-sub { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .hm-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hm-card.dest { grid-column: 1 / -1; }
  @media (min-width: 760px) { .hm-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } .hm-card.dest { grid-column: auto; } }
  .hm-lista { display: grid; gap: 8px; }
  .hm-card { position: relative; overflow: hidden; display: grid; gap: 4px; align-content: start; padding: 16px; text-decoration: none; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); transition: border-color .15s, transform .15s; }
  .hm-card::after { content: ""; position: absolute; right: -26px; top: -26px; width: 96px; height: 96px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 16%, transparent); pointer-events: none; }
  .hm-card:hover, .hm-card:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
  .hm-card.dest { border-color: var(--accent); }
  .hm-ico svg { width: 28px; height: 28px; color: var(--accent); }
  .hm-card strong { font-family: var(--font-display); font-size: 22px; line-height: 1.1; margin-top: 4px; }
  .hm-txt { color: var(--muted); font-size: 14px; }
  .hm-cta { margin-top: 8px; font-weight: 700; font-size: 14px; color: var(--accent); }

  /* ---------- Tipografia ---------- */
  h1 {
    font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
    font-size: clamp(34px, 8vw, 52px); line-height: 1; letter-spacing: .01em;
    margin: 4px 0 8px; text-wrap: balance;
  }
  h2 {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); margin: 32px 0 12px;
  }
  .lead { color: var(--muted); max-width: 60ch; margin: 0 0 24px; text-wrap: pretty; }

  /* ---------- Placar ---------- */
  .placar {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  }
  .placar div { padding: 14px 14px 12px; border-left: 1px solid var(--line); min-width: 0; }
  .placar div:first-child { border-left: 0; }
  .placar .n {
    font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .placar .n.temporada { color: var(--accent); }
  .placar .l { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  @media (max-width: 520px) {
    .placar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .placar div:nth-child(3) { border-left: 0; }
    .placar div:nth-child(n+3) { border-top: 1px solid var(--line); }
  }

  /* ---------- Etapas ---------- */
  .etapas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .etapas li {
    display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center;
    padding: 12px 2px; border-bottom: 1px solid var(--line);
  }
  .etapas .num { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .etapas .nome { min-width: 0; }
  .etapas li.feita .nome { color: var(--muted); }
  .etapas li.feita .num { color: var(--accent); }
  .chip {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .chip.feita { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip.proxima { border-color: var(--signal); color: var(--signal); }

  /* ---------- Estados vazios ---------- */
  .vazio {
    border: 1px dashed var(--line); border-radius: 6px; background: var(--surface);
    padding: 28px 20px; display: grid; justify-items: center; gap: 6px; text-align: center;
  }
  .vazio svg { width: 160px; max-width: 70%; height: auto; color: var(--muted); opacity: .75; margin-bottom: 8px; }
  .vazio strong { font-size: 17px; }
  .vazio p { margin: 0; color: var(--muted); max-width: 42ch; text-wrap: pretty; }
  .vazio .chip { margin-top: 10px; }

  /* ---------- Controles ---------- */
  .btn {
    appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--surface);
    padding: 9px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; min-height: 40px;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primario:hover { filter: brightness(1.08); }
  .btn.perigo { border-color: var(--signal); color: var(--signal); }
  .btn.pequeno { padding: 5px 12px; min-height: 34px; font-size: 13px; }
  .linha { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .bloco { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .opcao { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .opcao .txt { min-width: 0; }
  .opcao small { display: block; color: var(--muted); font-size: 13px; }
  .opcao input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }

  .lista { display: grid; gap: 8px; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
  .item .info { min-width: 0; }
  .item small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .aviso { border-left: 3px solid var(--signal); padding: 8px 12px; background: var(--surface); margin-bottom: 16px; font-size: 14px; }

  /* ---------- Aviso e janela ---------- */
  .toast {
    position: fixed; left: 50%; z-index: 20;
    bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px;
    padding: 10px 16px; border-radius: 6px; max-width: calc(100vw - 32px); text-align: center;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.erro { background: var(--signal); color: var(--bg); }
  @media (min-width: 860px) { .toast { bottom: 24px; } }

  .camada {
    position: fixed; inset: 0; z-index: 30; background: var(--scrim);
    display: grid; place-items: center; padding: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .camada[hidden] { display: none; }
  .janela {
    width: 100%; max-width: 460px; max-height: 100%; overflow: auto;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px;
    display: grid; gap: 12px;
  }
  .janela h3 { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 800; text-transform: uppercase; line-height: 1.05; }
  .janela p { margin: 0; color: var(--muted); }
  .janela textarea {
    width: 100%; min-height: 160px; resize: vertical; padding: 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
  }
  .janela .linha { justify-content: flex-end; }

  /* ===== RENNIW: identidade própria (dourado) ===== */
  :root { --bg: #f4f0e6; --surface: #fbf8f0; --surface-2: #ebe4d2; --ink: #211b0d; --muted: #6b6048; --line: #d6cbb0; --accent: #a8700a; --accent-ink: #ffffff; --signal: #b93e14; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14120c; --surface: #1e1a10; --surface-2: #2b2616; --ink: #f2ead6; --muted: #b0a47f; --line: #3a331d; --accent: #f0b429; --accent-ink: #231a02; --signal: #ff9460; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #14120c; --surface: #1e1a10; --surface-2: #2b2616; --ink: #f2ead6; --muted: #b0a47f; --line: #3a331d; --accent: #f0b429; --accent-ink: #231a02; --signal: #ff9460; color-scheme: dark; }
  body { padding-block: 0 40px; overflow-x: hidden; }
  .nav { display: none !important; }
  .app, .view { max-width: 820px; margin: 0 auto; }
  .wn { min-width: 0; }
  .wn-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
  .wn-sair { font-size: 13px; color: var(--muted); text-decoration: none; }
  .wn-logo { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); }
  .wn-logo svg { width: 26px; height: 26px; }
  .wn-logo b { font-family: var(--font-display); font-size: 26px; letter-spacing: .08em; color: var(--ink); }
  .wn-logo small { font-weight: 800; font-size: 11px; background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 1px 6px; }
  .wn-tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; margin: 0 0 14px; background: var(--bg); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .wn-tabs::-webkit-scrollbar { display: none; }
  .wn-tabs a { flex: none; padding: 8px 14px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 14px; color: var(--muted); border: 1px solid transparent; }
  .wn-tabs a[aria-current] { background: var(--accent); color: var(--accent-ink); }
  .wn-h1 { font-family: var(--font-display); font-size: 34px; margin: 4px 0 4px; line-height: 1.05; }
  .wn .lead { margin: 0 0 14px; color: var(--muted); }
  .wn .voltar { display: inline-block; margin-bottom: 6px; color: var(--muted); text-decoration: none; font-size: 14px; }
  .wn .erro { color: var(--signal); font-weight: 600; }
  .wn .dica { color: var(--muted); font-size: 13px; margin: 6px 0; }
  .wn .secao { margin: 0 0 18px; }
  .wn .secao h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 8px; }
  .wn-h3 { margin: 12px 0 6px; font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
  .wn a.item { text-decoration: none; }
  .wn .barra-topo { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .wn input[type=text], .wn input[type=search], .wn input[type=number], .wn select, .wn textarea { width: 100%; padding: 9px 10px; min-height: 40px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
  .wn .campo label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .wn .campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .wn summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); }
  .chip.proxima { background: var(--accent); color: var(--accent-ink); }
  .wn-hero { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; padding: 22px 18px; margin-bottom: 14px; background: var(--surface); }
  .wn-hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; background: repeating-linear-gradient(135deg, transparent 0 28px, color-mix(in srgb, var(--accent) 10%, transparent) 28px 56px); }
  .wn-hero > * { position: relative; }
  .wn-hero .hm-titulo { font-family: var(--font-display); margin: 0 0 8px; }
  .wn-resumo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
  .wn-resumo div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 6px; text-align: center; }
  .wn-resumo b { display: block; font-family: var(--font-display); font-size: 26px; color: var(--accent); }
  .wn-resumo span { font-size: 12px; color: var(--muted); }
  .wn-pos { font-family: var(--font-display); font-size: 22px; width: 26px; color: var(--accent); }
  .wn-mini, .wn-card-av { width: 44px; height: 44px; flex: none; border-radius: 50%; overflow: hidden; background: var(--surface-2); }
  .wn-mini svg, .wn-card-av svg, .wn-ed-av svg { width: 100%; height: 100%; display: block; }
  .wn a.item.hist { flex-wrap: nowrap; }
  .wn-rt { text-align: right; } .wn-rt b { font-family: var(--font-display); font-size: 22px; color: var(--accent); } .wn-rt small { display: block; }
  .wn-placar { font-family: var(--font-display); font-size: 17px; color: var(--accent); padding: 0 4px; }
  .wn-grade { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .wn-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; text-decoration: none; min-width: 0; }
  .wn-card:hover { border-color: var(--accent); }
  .wn-card-info { flex: 1; min-width: 0; } .wn-card-info strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wn-card-info small { display: block; color: var(--muted); font-size: 12px; }
  .ovr { display: inline-grid; place-items: center; min-width: 38px; height: 34px; padding: 0 6px; border-radius: 6px; font-family: var(--font-display); font-size: 20px; font-weight: 800; background: var(--surface-2); }
  .ovr.a { background: #1d7a45; color: #fff; } .ovr.b { background: var(--accent); color: var(--accent-ink); } .ovr.d { background: #8a8a8a; color: #fff; }
  .wn-ed-top { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .wn-ed-av { width: 84px; height: 84px; border-radius: 50%; overflow: hidden; background: var(--surface-2); flex: none; }
  .wn-ed-ovr { display: grid; } .wn-ed-ovr span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; } .wn-ed-ovr b { font-family: var(--font-display); font-size: 58px; line-height: 1; color: var(--accent); } .wn-ed-ovr small { color: var(--muted); }
  .wn-attrs { display: grid; gap: 8px; }
  .wn-attr { display: grid; grid-template-columns: minmax(104px, 1.1fr) 3fr 56px; gap: 10px; align-items: center; }
  .wn-attr label { font-size: 14px; font-weight: 600; } .wn-attr .peso { font-weight: 400; font-size: 11px; color: var(--muted); display: block; }
  .wn-attr.sem-peso label { opacity: .6; }
  .wn-attr input[type=range] { width: 100%; accent-color: var(--accent); min-height: 30px; padding: 0; }
  .wn-attr input[type=number] { padding: 6px; text-align: center; }
  .wn-chk { display: flex; gap: 10px; align-items: center; margin: 10px 0 0; font-size: 14px; } .wn-chk.off { opacity: .5; } .wn-chk input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .wn-vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin: 12px 0; }
  .wn-x { align-self: center; font-family: var(--font-display); font-size: 30px; color: var(--accent); }
  .wn-lado { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 12px 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); height: 100%; min-width: 0; }
  .wn-lado.vazio { color: var(--muted); align-content: center; } .wn-lado small { color: var(--muted); font-size: 12px; } .wn-lado strong { font-size: 15px; word-break: break-word; }
  .wn-card-av.g { width: 64px; height: 64px; }
  .wn-go { width: 100%; min-height: 52px; font-size: 17px; margin-top: 6px; } .wn-go[disabled] { opacity: .45; cursor: not-allowed; }
  .wn-placar-box { text-align: center; padding: 16px 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .wn-placar-box > small { color: var(--muted); }
  .wn-pl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin-top: 8px; }
  .wn-pl a { display: grid; gap: 2px; justify-items: center; text-decoration: none; min-width: 0; opacity: .85; } .wn-pl a.venc { opacity: 1; } .wn-pl a.venc strong { color: var(--accent); } .wn-pl small { color: var(--muted); }
  .wn-num { font-family: var(--font-display); font-size: 58px; line-height: 1; font-weight: 800; white-space: nowrap; } .wn-num i { font-style: normal; font-size: 26px; color: var(--muted); margin: 0 6px; }
  .wn-res { margin: 8px 0 0; font-weight: 700; }
  .wn-est-top { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; color: var(--accent); }
  .wn-est { display: grid; grid-template-columns: 34px 1fr auto 1fr 34px; align-items: center; gap: 6px; margin: 7px 0; font-size: 13px; }
  .wn-est > b { text-align: center; } .wn-est > span { color: var(--muted); text-align: center; font-size: 12px; max-width: 110px; }
  .wn-barra { height: 8px; border-radius: 4px; background: var(--surface-2); display: flex; justify-content: flex-end; overflow: hidden; } .wn-barra i { background: var(--accent); display: block; } .wn-barra.b { justify-content: flex-start; } .wn-barra.b i { background: var(--ink); opacity: .55; }

<body>


<div class="app">
  <nav class="nav" id="nav" aria-label="Menu principal"></nav>
  <main class="view" id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="camada" id="camada" hidden></div>

<script>
(() => {
  'use strict';
  const Store = { get: () => ({ clubes: [], competicoes: [], partidas: [], calendario: { temporada: 1 } }) };
  const Disco = (() => {
    const memoria = {};
    let ok = false;
    try { localStorage.setItem('pf:teste', '1'); localStorage.removeItem('pf:teste'); ok = true; } catch (e) { ok = false; }
    return {
      get persistente() { return ok; },
      ler(k) {
        try { if (ok) return localStorage.getItem(k); } catch (e) { /* usa memória */ }
        return Object.prototype.hasOwnProperty.call(memoria, k) ? memoria[k] : null;
      },
      gravar(k, v) {
        try { if (ok) { localStorage.setItem(k, v); return true; } } catch (e) { /* usa memória */ }
        memoria[k] = v;
        return false;
      }
    };
  })();

  const UI = (() => {
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let toastTimer = null;
    function toast(msg, erro) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.toggle('erro', !!erro);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
    }

    function dataHora(iso) {
      try { return new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return iso; }
    }

    // Janela dentro da página (o visualizador não exibe confirm/alert).
    const camada = document.getElementById('camada');
    function fechar() { camada.hidden = true; camada.innerHTML = ''; }
    function abrir(html) {
      camada.innerHTML = '<div class="janela" role="dialog" aria-modal="true">' + html + '</div>';
      camada.hidden = false;
      return camada.firstElementChild;
    }
    camada.addEventListener('click', e => { if (e.target === camada) fechar(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !camada.hidden) fechar(); });

    function perguntar(titulo, texto, rotuloOk, perigo) {
      return new Promise(resolve => {
        const j = abrir(`<h3>${esc(titulo)}</h3><p>${esc(texto)}</p>
          <div class="linha"><button class="btn" data-r="0" id="pf-cancelar">Cancelar</button>
          <button class="btn ${perigo ? 'perigo' : 'primario'}" data-r="1">${esc(rotuloOk)}</button></div>`);
        j.addEventListener('click', e => {
          const b = e.target.closest('[data-r]');
          if (!b) return;
          fechar();
          resolve(b.dataset.r === '1');
        });
        j.querySelector('#pf-cancelar').focus();
      });
    }

    const PITCH = `<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="4" y="4" width="152" height="92" rx="2"/><line x1="80" y1="4" x2="80" y2="96"/>
      <circle cx="80" cy="50" r="14"/><circle cx="80" cy="50" r="1.5" fill="currentColor"/>
      <rect x="4" y="28" width="22" height="44"/><rect x="134" y="28" width="22" height="44"/>
      <rect x="4" y="40" width="8" height="20"/><rect x="148" y="40" width="8" height="20"/></svg>`;

    function vazio(titulo, texto, etapa, acao) {
      return `<div class="vazio">${PITCH}<strong>${esc(titulo)}</strong><p>${esc(texto)}</p>${acao || ''}${etapa ? `<span class="chip">Etapa ${etapa}</span>` : ''}</div>`;
    }

    return { esc, toast, dataHora, abrir, fechar, perguntar, vazio };
  })();

  /* ====================================================================
     Telas e rotas
     Para criar uma tela nova: adicione uma entrada em ROTAS e uma função.
     ==================================================================== */
  const sortear = arr => arr[Math.floor(Math.random() * arr.length)];
  const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const POSICOES = { GOL: 'Goleiro', ZAG: 'Zagueiro', LD: 'Lateral-direito', LE: 'Lateral-esquerdo', VOL: 'Volante', MC: 'Meio-campista', MEI: 'Meia-atacante', PD: 'Ponta-direita', PE: 'Ponta-esquerda', ATA: 'Atacante' };
  const ATRIBUTOS = [['vel', 'Velocidade'], ['fin', 'Finalização'], ['pas', 'Passe'], ['dri', 'Drible'], ['def', 'Defesa'], ['fis', 'Físico'], ['res', 'Resistência'], ['gol', 'Goleiro'], ['int', 'Inteligência tática']];
  const PES = { direito: 'Direito', esquerdo: 'Esquerdo', ambidestro: 'Ambidestro' };
  const TRACOS = { lider: 'Líder', velocista: 'Velocista', incansavel: 'Incansável', faltas: 'Especialista em faltas', cabeceador: 'Bom cabeceador', finalizador: 'Finalizador nato', paredao: 'Paredão' };
  const PELES = ['#f1c9a5', '#e0ac7e', '#c68a5c', '#a1683d', '#7a4a2a', '#4f3020'];
  const CABELOS = ['#1b1410', '#3b2616', '#6b4423', '#b8893d', '#c9c9c9', '#8a2d1a'];
  const ESTILOS_CABELO = { curto: 'Curto', raspado: 'Raspado', crespo: 'Crespo', longo: 'Longo', careca: 'Careca' };
  const NIVEIS = { base: 'Base (54–66)', regular: 'Regular (66–76)', bom: 'Bom (76–86)', craque: 'Craque (86–95)' };
  const FAIXAS = { base: [54, 66], regular: [66, 76], bom: [76, 86], craque: [86, 95] };
  const DISTRIBUICAO = { GOL: 3, ZAG: 4, LD: 2, LE: 2, VOL: 3, MC: 3, MEI: 2, PD: 1, PE: 1, ATA: 2 };
  const VIZINHAS = { GOL: [], ZAG: ['LD', 'LE', 'VOL'], LD: ['LE', 'PD', 'ZAG'], LE: ['LD', 'PE', 'ZAG'], VOL: ['MC', 'ZAG'], MC: ['VOL', 'MEI'], MEI: ['MC', 'PD', 'PE', 'ATA'], PD: ['PE', 'ATA', 'LD', 'MEI'], PE: ['PD', 'ATA', 'LE', 'MEI'], ATA: ['PD', 'PE', 'MEI'] };
  const ALTURA_BASE = { GOL: 187, ZAG: 185, LD: 176, LE: 176, VOL: 181, MC: 178, MEI: 175, PD: 173, PE: 173, ATA: 180 };

  // Peso de cada atributo no overall, por posição (cada linha soma 1).
  const PESO_LATERAL = { def: .22, vel: .20, res: .18, pas: .14, dri: .10, int: .10, fis: .06 };
  const PESO_PONTA = { vel: .24, dri: .24, pas: .14, fin: .14, int: .10, res: .08, fis: .04, def: .02 };
  const PESOS = {
    GOL: { gol: .70, int: .12, fis: .08, pas: .05, res: .05 },
    ZAG: { def: .34, fis: .22, int: .16, vel: .10, pas: .08, res: .06, dri: .02, fin: .02 },
    LD: PESO_LATERAL, LE: PESO_LATERAL,
    VOL: { def: .26, pas: .20, int: .18, fis: .14, res: .14, dri: .04, vel: .04 },
    MC: { pas: .26, int: .18, dri: .14, res: .14, def: .10, fis: .08, vel: .06, fin: .04 },
    MEI: { pas: .24, dri: .22, int: .18, fin: .14, vel: .10, res: .06, fis: .04, def: .02 },
    PD: PESO_PONTA, PE: PESO_PONTA,
    ATA: { fin: .34, vel: .16, dri: .14, fis: .12, int: .10, pas: .06, res: .04, def: .04 }
  };
  // Pontos acima ou abaixo do nível do jogador em cada atributo, por posição.
  const OFF_LATERAL = { vel: 6, fin: -18, pas: -2, dri: -6, def: 4, fis: -2, res: 8, int: -2 };
  const OFF_PONTA = { vel: 12, fin: 2, pas: 0, dri: 10, def: -26, fis: -12, res: 2, int: 0 };
  const PERFIL = {
    GOL: { vel: -22, fin: -45, pas: -12, dri: -35, def: -30, fis: -4, res: -10, gol: 12, int: -8 },
    ZAG: { vel: -6, fin: -28, pas: -10, dri: -22, def: 12, fis: 10, res: 0, int: 2 },
    LD: OFF_LATERAL, LE: OFF_LATERAL,
    VOL: { vel: -8, fin: -18, pas: 4, dri: -8, def: 10, fis: 6, res: 6, int: 4 },
    MC: { vel: -4, fin: -10, pas: 10, dri: 2, def: -6, fis: -2, res: 6, int: 8 },
    MEI: { vel: 0, fin: 2, pas: 10, dri: 10, def: -26, fis: -12, res: -2, int: 8 },
    PD: OFF_PONTA, PE: OFF_PONTA,
    ATA: { vel: 6, fin: 14, pas: -8, dri: 4, def: -34, fis: 4, res: -6, int: 2 }
  };
  const NOMES = ('João Pedro Lucas Gabriel Mateus Rafael Bruno Thiago Felipe Diego Caio Vitor André Henrique Leandro Rodrigo Fábio Marcelo Samuel Davi Igor Renan Wesley Everton Arthur Nicolas Murilo Otávio ' +
    'Gustavo Leonardo Eduardo Daniel Matheus Guilherme Vinícius Fernando Ricardo Alexandre Sérgio Paulo Luan Kauê Yuri Breno Danilo Maicon Willian Jefferson Anderson Douglas Éder Elias Emerson Flávio Gilberto Hugo Ícaro Jonas Júlio Kléber Lázaro Mário Nelson Osvaldo Patrick Quirino Ronaldo Sandro Tadeu Ulisses Valter Washington Xavier Yan Zeca Adriano Alan Alisson Bernardo Cauã Cleiton Cristiano Dener Edson Fausto Genivaldo Heitor Isaque Jair Jorge Kaio Léo Luciano Marlon Natan Orlando Pietro Rômulo Saulo Tales Uelinton Vagner Wagner Wellington Yago Cássio Dudu Enzo Fabrício Geovane Ivan Jhonatan Lincoln Moisés Nathan Rhuan Sidney Tiago Vladimir ' +
    'Santiago Mateo Joaquín Facundo Lautaro Emiliano Hakim Youssef Kofi Sadio Kenji Haruto Luka Marko Mehmet Mikael Jonas Lars Stefan Oliver Harry Jamal Théo Lucien Matteo Luca Alessandro Diogo Rúben Tomás').split(' ');
  const SOBRENOMES = ('Silva Santos Oliveira Souza Lima Pereira Costa Ribeiro Almeida Carvalho Gomes Martins Araújo Barbosa Rocha Dias Nunes Moreira Cardoso Teixeira Moura Freitas Ramos Borges Campos Monteiro ' +
    'Ferreira Alves Rodrigues Fernandes Gonçalves Correia Mendes Machado Lopes Castro Pinto Cavalcanti Andrade Azevedo Duarte Farias Fonseca Guimarães Henrique Ibrahim Jesus Lacerda Macedo Medeiros Miranda Nascimento Neves Paiva Peixoto Prado Quintela Rezende Sampaio Siqueira Tavares Toledo Vargas Vasconcelos Viana Xavier Zanetti Amaral Assis Bastos Batista Bezerra Brito Caldeira Camargo Coelho Cunha Dantas Esteves Falcão Galvão Guedes Holanda Jardim Leite Lins Magalhães Matos Melo Noronha Pacheco Paixão Pires Queiroz Rangel Salgado Sá Trindade Valadares Vieira Aguiar Bento Cabral Domingues Furtado Lessa Marinho Menezes Nogueira Parente Quaresma Reis Sales Tenório Uchoa Veloso Zago ' +
    'Fernández Gutiérrez Pérez Romero Sosa Benítez Morales Dubois Laurent Moreau Rossi Ferrari Bianchi Müller Schneider Keller Okafor Diallo Mbaye Traoré Tanaka Suzuki Kovač Horvat Petrović Jansen De Vries Nilsson Johnson Walker Clarke').split(' ');
  // Nome completo com variedade: simples, composto (dois sobrenomes) ou "nome de campo" ocasional.
  function nomeDeJogador() {
    const r = Math.random(), n = sortear(NOMES);
    if (r < 0.14) return n + ' ' + sortear(SOBRENOMES) + ' ' + sortear(SOBRENOMES);
    if (r < 0.20) return n + ' ' + ['Jr.', 'Neto', 'Filho', 'Sobrinho'][Math.floor(Math.random() * 4)] + ' ' + sortear(SOBRENOMES);
    if (r < 0.24) return n + ' "' + sortear(['Bala', 'Pelé', 'Tigre', 'Gato', 'Alemão', 'Paraíba', 'Mineiro', 'Foguete', 'Maestro', 'Torre', 'Cobra', 'Flecha', 'Tanque']) + '" ' + sortear(SOBRENOMES);
    return n + ' ' + sortear(SOBRENOMES);
  }

  const tem = (o, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k);
  const clone = o => JSON.parse(JSON.stringify(o));
  const limitar = (n, a, b) => Math.min(b, Math.max(a, n));
  const inteiro = (v, a, b, f) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? limitar(n, a, b) : f; };

  function overall(j) {
    const pesos = PESOS[j.pos] || PESOS.MC;
    return Math.round(Object.keys(pesos).reduce((s, k) => s + pesos[k] * (Number(j.attr[k]) || 0), 0));
  }

  // Quão bem o jogador se encaixa em uma posição do campo.
  // pen = pontos tirados do overall por jogar fora do que domina.
  function adequacao(j, pos) {
    if (!pos || j.pos === pos) return { nivel: 'natural', pen: 0, txt: 'Posição natural' };
    if ((j.posSec || []).includes(pos)) return { nivel: 'secundaria', pen: 0, txt: 'Posição secundária' };
    if ((VIZINHAS[pos] || []).includes(j.pos) || (VIZINHAS[j.pos] || []).includes(pos)) return { nivel: 'vizinha', pen: 3, txt: 'Posição próxima' };
    return { nivel: 'fora', pen: 6, txt: 'Fora de posição' };
  }

  // Overall do jogador atuando em `pos`: usa os pesos daquela posição.
  // Um goleiro no ataque passa a valer pela finalização, velocidade e drible dele, não pelo atributo Goleiro.
  function overallNaPosicao(j, pos) {
    if (!pos || pos === j.pos) return overall(j);
    const pesos = PESOS[pos] || PESOS.MC;
    const base = Object.keys(pesos).reduce((s, k) => s + pesos[k] * (Number(j.attr[k]) || 0), 0);
    return Math.max(0, Math.round(base - adequacao(j, pos).pen));
  }

  // Distribui jogadores pelas posições de uma formação, sempre o melhor para cada função. O goleiro é escolhido primeiro.
  function distribuirNosSlots(coords, pool) {
    const usados = new Set();
    const res = new Array(coords.length);
    const ordem = coords.map((_, i) => i).sort((a, b) => (coords[b].pos === 'GOL') - (coords[a].pos === 'GOL'));
    ordem.forEach(i => {
      const slot = coords[i];
      let melhor = null, nota = -1;
      pool.forEach(j => {
        if (usados.has(j.id)) return;
        const n = overallNaPosicao(j, slot.pos);
        if (n > nota) { nota = n; melhor = j; }
      });
      if (melhor) usados.add(melhor.id);
      res[i] = { jogadorId: melhor ? melhor.id : null, x: slot.x, y: slot.y, slotPos: slot.pos };
    });
    return res;
  }

  /* ---------- Nacionalidades ----------
     Tudo que depende de país passa por aqui: lista de países (iso/continente/cidades), probabilidades de geração

      const mp = st.mundoPronto && Array.isArray(st.mundoPronto.paises) ? st.mundoPronto : { v: 1, paises: [] };
      paises.forEach(p => { if (!mp.paises.includes(p) && novosC.some(c => c.pais === p)) mp.paises.push(p); });
      st.mundoPronto = mp;
    });
    Store.salvarAgora();
    try { ligasDoMundo(); } catch (e) { console.error(e); }
    return { clubes: novosC.length, jogadores: novosJ.length, paises };
  }

  // Um campeonato por país instalado e por temporada. O país do clube da carreira usa as divisões da carreira.
  function ligasDoMundo() {
    const st = Store.get(), mp = st.mundoPronto; if (!mp || !Array.isArray(mp.paises)) return 0;
    const temp = st.calendario.temporada, c = st.carreira, paisCar = c && c.status === 'ativa' ? paisDoClube(c.clubeId) : '';
    const novas = [], contagem = {};
    st.jogadores.forEach(j => { if (j) contagem[j.clubeId] = (contagem[j.clubeId] || 0) + 1; });
    mp.paises.forEach(pais => {
      if (pais === paisCar) return;
      if (st.competicoes.some(x => x && x.liga === pais && x.temporada === temp)) return;
      const cl = st.clubes.filter(x => x && x.pais === pais && (contagem[x.id] || 0) >= 11);
      if (cl.length < 4) return;
      const ids = cl.map(x => x.id), nomes = Object.fromEntries(cl.map(x => [x.id, { nome: x.nome, sigla: x.sigla }]));
      const comp = criarCompeticao({ nome: 'Campeonato ' + (MUNDO_DEF[pais] ? MUNDO_DEF[pais].adj : pais) + ' ' + temp, tipo: 'liga', clubes: ids, nomes, regras: { returno: false } });
      comp.liga = pais; novas.push(comp);
    });
    if (!novas.length) return 0;
    Store.update(s => { novas.forEach(x => s.competicoes.push(x)); });
    Store.salvarAgora();
    return novas.length;
  }
  // Resultado sem jogar a partida: usado só nos campeonatos de fundo do mundo pronto.
  function placarRapido(st, casa, fora) {
    const d = (forcaClube(st, casa) - forcaClube(st, fora)) / 30;
    return [poisson(1.4 * Math.exp(d + 0.08)), poisson(1.1 * Math.exp(-d))];
  }
  // Fecha o que falta de cada campeonato de país (na virada de temporada).
  function fecharLigasMundo(temp) {
    Store.update(st => {
      st.competicoes.forEach(cp => {
        if (!cp || !cp.liga || cp.temporada !== temp || cp.status !== 'andamento') return;
        for (let g = 0; g < 4000 && cp.status === 'andamento'; g++) {
          const jg = jogosJogaveis(cp); if (!jg.length) break;
          jg.forEach(j => { j.res = { placar: placarRapido(st, j.casa, j.fora), penaltis: null, partidaId: null }; });
          avancarCompeticao(cp);
        }
        if (cp.status === 'encerrada') { try { mundoCompEncerrada(st, cp, null, null); } catch (e) { console.error(e); } }
      });
    });
  }

  // Janela de instalação (usada no Início e em Clubes).
  function abrirInstalarMundo(aoFinal) {
    const esc = UI.esc, sel = new Set(['Brasil', 'Argentina', 'Inglaterra', 'Espanha', 'Itália', 'Alemanha']);
    let qtd = 16;
    const dlg = UI.abrir('<div id="mp-corpo"></div>'); dlg.style.maxWidth = '560px';
    const corpo = dlg.querySelector('#mp-corpo');

      corpo.innerHTML = `<h3>Mundo pronto</h3>

        <div class="campo"><label>Clubes por país<select id="mp-qtd">${[8, 12, 16, 20].map(x => `<option value="${x}" ${x === qtd ? 'selected' : ''}>${x} clubes</option>`).join('')}</select></label></div>
        <div class="escolha-lista" style="max-height:260px;overflow:auto">${MUNDO_PAISES.map(p => `<label class="opt"><input type="checkbox" data-pais="${esc(p)}" ${sel.has(p) ? 'checked' : ''}><span class="opt-nome"><strong>${esc(nacRotulo(p))}</strong><small>${MUNDO_DEF[p].forca >= 2 ? 'liga muito forte' : MUNDO_DEF[p].forca >= 1.5 ? 'liga forte' : MUNDO_DEF[p].forca >= 1 ? 'liga média' : 'liga mais modesta'}</small></span></label>`).join('')}</div>
        <p class="dica" id="mp-info">${n} clubes e cerca de ${n * 23} jogadores${existentes + n > MUNDO_MAX_CLUBES ? ' · limite de ' + MUNDO_MAX_CLUBES + ' clubes no total: os últimos países podem ficar incompletos' : ''}.</p>
        <div class="linha" style="gap:8px;flex-wrap:wrap"><button type="button" class="btn primario" id="mp-ok" ${sel.size ? '' : 'disabled'}>Instalar mundo</button><button type="button" class="btn" id="mp-cancel">Cancelar</button></div>`;
    }
    dlg.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
    dlg.addEventListener('change', e => {
      if (e.target.id === 'mp-qtd') { qtd = Number(e.target.value); montar(); }
      else if (e.target.dataset.pais) { e.target.checked ? sel.add(e.target.dataset.pais) : sel.delete(e.target.dataset.pais); montar(); }
    });
    dlg.addEventListener('click', e => {
      if (e.target.closest('#mp-cancel')) { UI.fechar(); return; }
      if (!e.target.closest('#mp-ok')) return;
      const b = e.target.closest('#mp-ok'); b.disabled = true; b.textContent = 'Instalando…';
      setTimeout(() => {
        let r;
        try { r = instalarMundo({ paises: MUNDO_PAISES.filter(p => sel.has(p)), qtd }); } catch (err) { console.error(err); UI.fechar(); UI.toast('Não foi possível instalar o mundo.', true); return; }
        UI.fechar(); UI.toast(r.clubes + ' clubes e ' + r.jogadores + ' jogadores instalados');
        if (aoFinal) aoFinal(r);

  }
  const COMP_TIPOS = { liga: 'Liga', copa: 'Copa', torneio: 'Torneio personalizado' };
  const COMP_FORMATOS = { liga: 'Pontos corridos', mata: 'Mata-mata', grupos: 'Fase de grupos e mata-mata', misto: 'Fases personalizadas' };
  const compInt = (v, a, b, f) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : f; };

  function embaralhar(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
    return r;
  }

  // Método do círculo: todas as rodadas de um turno (cada clube joga uma vez por rodada).
  function rodadasLiga(ids, returno) {
    const t = ids.slice(); if (t.length % 2) t.push(null);
    const n = t.length, rod = [];
    for (let r = 0; r < n - 1; r++) {
      const jogos = [];
      for (let i = 0; i < n / 2; i++) {
        const a = t[i], b = t[n - 1 - i];
        if (a != null && b != null) jogos.push(r % 2 ? { casa: b, fora: a } : { casa: a, fora: b });
      }
      rod.push(jogos);
      t.splice(1, 0, t.pop());
    }
    if (returno) rod.slice().forEach(jogos => rod.push(jogos.map(j => ({ casa: j.fora, fora: j.casa }))));
    return rod;
  }

  /* ---------- Fases configuráveis (specs) ----------
     spec = { tipo:'liga'|'mata', nome, grupos, classificam, extras, returno, idaVolta, finalIdaVolta, terceiro, golFora, seed:'sorteio'|'ordem'|'manual', manual:{clubeId:grupo} } */
  function specSegura(s) {
    s = s || {};
    const tipo = s.tipo === 'mata' ? 'mata' : 'liga';
    return {
      tipo, nome: String(s.nome || '').slice(0, 30), grupos: compInt(s.grupos, 1, 8, 1), classificam: compInt(s.classificam, 1, 16, 2), extras: compInt(s.extras, 0, 8, 0),
      returno: !!s.returno, idaVolta: !!s.idaVolta, finalIdaVolta: !!s.finalIdaVolta, terceiro: !!s.terceiro, golFora: !!s.golFora,
      seed: ['sorteio', 'ordem', 'manual'].includes(s.seed) ? s.seed : 'sorteio', manual: s.manual && typeof s.manual === 'object' ? s.manual : null
    };
  }
  // Competições antigas (sem specs) são lidas a partir de plano + regras.
  function specsDe(comp) {
    if (Array.isArray(comp.specs) && comp.specs.length) return comp.specs.map(specSegura);
    const r = comp.regras || {}, plano = Array.isArray(comp.plano) && comp.plano.length ? comp.plano : [comp.fases && comp.fases[0] ? comp.fases[0].tipo : 'liga'];
    return plano.map((t, i) => t === 'mata' ? specSegura({ tipo: 'mata', idaVolta: r.idaVolta }) : specSegura({ tipo: 'liga', grupos: i === 0 && plano.length > 1 ? r.grupos : 1, classificam: r.classificam, returno: r.returno }));
  }
  function nomesFases(specs) {
    const base = specs.map(s => s.nome || (s.tipo === 'mata' ? 'Mata-mata' : s.grupos > 1 ? 'Fase de grupos' : 'Pontos corridos'));
    return base.map((n, i) => base.filter(x => x === n).length > 1 ? n + ' ' + (base.slice(0, i + 1).filter(x => x === n).length) : n);
  }
  const ehPot2 = n => n >= 2 && (n & (n - 1)) === 0;
  // Ordem das sementes numa chave de n times (1 x n, 2 x n-1 ... sem os favoritos se cruzarem cedo).
  function ordemChave(n) { let r = [1]; while (r.length < n) { const m = r.length * 2; r = r.flatMap(x => [x, m + 1 - x]); } return r; }
  function evitarMesmoGrupo(l) {
    for (let i = 0; i + 1 < l.length; i += 2) {
      if (l[i].grupo !== l[i + 1].grupo) continue;
      for (let j = 0; j + 1 < l.length; j += 2) {
        if (j === i) continue;
        if (l[i].grupo !== l[j + 1].grupo && l[j].grupo !== l[i + 1].grupo) { const t = l[i + 1]; l[i + 1] = l[j + 1]; l[j + 1] = t; break; }
      }
    }
  }

  function faseLiga(ids, spec, nGrupos, nome) {
    const grupos = [];
    if (nGrupos <= 1) grupos.push({ nome: 'Grupo único', clubes: ids.slice() });
    else {
      for (let g = 0; g < nGrupos; g++) grupos.push({ nome: 'Grupo ' + String.fromCharCode(65 + g), clubes: [] });
      if (spec.seed === 'manual' && spec.manual) {
        const sem = [];
        ids.forEach(id => { const g = spec.manual[id]; if (Number.isInteger(g) && g >= 0 && g < nGrupos) grupos[g].clubes.push(id); else sem.push(id); });
        sem.forEach(id => { grupos.sort((a, b) => a.clubes.length - b.clubes.length); grupos[0].clubes.push(id); });
        grupos.sort((a, b) => a.nome.localeCompare(b.nome));
      } else if (spec.seed === 'ordem') {
        // serpentina: os melhores colocados da lista ficam em grupos diferentes
        ids.forEach((id, i) => { const rod = Math.floor(i / nGrupos), pos = i % nGrupos; grupos[rod % 2 ? nGrupos - 1 - pos : pos].clubes.push(id); });
      } else embaralhar(ids).forEach((id, i) => grupos[i % nGrupos].clubes.push(id));
    }
    const jogos = [];
    grupos.forEach((g, gi) => rodadasLiga(g.clubes, spec.returno).forEach((rod, ri) => rod.forEach(j => jogos.push({ id: novoId() + jogos.length, rodada: ri + 1, grupo: gi, conf: null, perna: null, casa: j.casa, fora: j.fora, res: null }))));
    return { nome, tipo: 'liga', grupos, rodadasMata: [], jogos, concluida: false };
  }

  function nomeRodadaMata(tam) { return tam === 2 ? 'Final' : tam === 4 ? 'Semifinais' : tam === 8 ? 'Quartas de final' : tam === 16 ? 'Oitavas de final' : 'Rodada de ' + tam; }

  // Cria uma rodada de mata-mata. Quem sobra para completar potência de 2 passa direto (os primeiros da lista).
  // 'perdedores' (opcional): os dois semifinalistas eliminados, para a disputa do 3º lugar (jogo único, junto da final).
  function rodadaMata(fase, ids, cfg, perdedores) {
    let tam = 2; while (tam < ids.length) tam *= 2;
    const byes = tam - ids.length, diretos = ids.slice(0, byes), jogam = ids.slice(byes);
    const rod = { nome: nomeRodadaMata(tam), diretos, confrontos: [] };
    const nRod = fase.rodadasMata.length + 1;
    const ida = tam > 2 ? !!cfg.idaVolta : !!cfg.finalIdaVolta;
    for (let i = 0; i + 1 < jogam.length; i += 2) {
      const conf = { id: novoId() + 'c' + i, a: jogam[i], b: jogam[i + 1] };
      rod.confrontos.push(conf);
      fase.jogos.push({ id: novoId() + 'p1' + i, rodada: nRod, grupo: null, conf: conf.id, perna: ida ? 1 : null, casa: conf.a, fora: conf.b, res: null });
    }
    if (ida) rod.confrontos.forEach((conf, i) => fase.jogos.push({ id: novoId() + 'p2' + i, rodada: nRod, grupo: null, conf: conf.id, perna: 2, casa: conf.b, fora: conf.a, res: null }));
    if (perdedores && perdedores.length === 2) {
      const conf = { id: novoId() + 'c3', a: perdedores[0], b: perdedores[1], terceiro: true };
      rod.confrontos.push(conf);
      fase.jogos.push({ id: novoId() + 'p3', rodada: nRod, grupo: null, conf: conf.id, perna: null, casa: conf.a, fora: conf.b, res: null });
    }
    fase.rodadasMata.push(rod);
  }
  function faseMata(ids, spec, nome) {
    const f = { nome, tipo: 'mata', grupos: [], rodadasMata: [], jogos: [], concluida: false, cfg: { idaVolta: !!spec.idaVolta, finalIdaVolta: !!spec.finalIdaVolta, terceiro: !!spec.terceiro, golFora: !!spec.golFora } };
    rodadaMata(f, ids, f.cfg);
    return f;
  }

  // Specs pedidas: usa 'o.specs' ou converte o formato antigo (liga / mata / grupos).
  function specsDoPedido(o) {
    if (Array.isArray(o.specs) && o.specs.length) return o.specs.map(specSegura);
    const r = o.regras || {};
    const formato = o.tipo === 'liga' ? 'liga' : o.tipo === 'copa' ? 'mata' : (COMP_FORMATOS[o.formato] ? o.formato : 'liga');
    const plano = formato === 'liga' ? ['liga'] : formato === 'mata' ? ['mata'] : ['liga', 'mata'];
    return specsDe({ regras: r, plano });
  }
  function formatoDeSpecs(specs) {
    if (specs.length === 1) return specs[0].tipo === 'mata' ? 'mata' : 'liga';
    return specs.length === 2 && specs[0].tipo === 'liga' && specs[0].grupos > 1 && specs[1].tipo === 'mata' ? 'grupos' : 'misto';
  }

  function criarCompeticao(o) {
    const r0 = o.regras || {}, specs = specsDoPedido(o), nomes = nomesFases(specs);
    const s0 = specs[0], l0 = specs.find(s => s.tipo === 'liga') || {}, m0 = specs.find(s => s.tipo === 'mata') || {};
    const regras = {
      pv: compInt(r0.pv, 0, 9, 3), pe: compInt(r0.pe, 0, 9, 1), pd: compInt(r0.pd, 0, 9, 0), desempate: ['padrao', 'confronto', 'gols'].includes(r0.desempate) ? r0.desempate : 'padrao',
      returno: !!l0.returno, idaVolta: !!m0.idaVolta, grupos: l0.grupos || 1, classificam: l0.classificam || 2
    };
    const formato = formatoDeSpecs(specs);
    const ordenado = s0.seed === 'ordem' || s0.seed === 'manual';
    const ids = ordenado ? o.clubes.slice() : embaralhar(o.clubes);
    const comp = {
      id: novoId(), nome: String(o.nome || '').trim().slice(0, 40) || COMP_TIPOS[o.tipo] || 'Competição', tipo: o.tipo, formato, temporada: Store.get().calendario.temporada, criadaEm: new Date().toISOString(),
      regras, specs, clubes: ids, nomes: o.nomes || {}, plano: specs.map(s => s.tipo), fases: [], status: 'andamento', campeaoId: null, stats: {}
    };
    if (s0.tipo === 'mata') comp.fases.push(faseMata(s0.seed === 'ordem' && ehPot2(ids.length) ? ordemChave(ids.length).map(i => ids[i - 1]) : ids, s0, nomes[0]));
    else comp.fases.push(faseLiga(ids, s0, s0.grupos, nomes[0]));
    return comp;
  }

  // Valida o formulário antes de criar. Devolve texto de erro ou ''.
  function validarCompeticao(o) {
    const n = o.clubes.length, specs = specsDoPedido(o);
    if (n < 2) return 'Escolha pelo menos 2 clubes.';
    if (n > 32) return 'O máximo é 32 clubes.';
    if (specs.length > 4) return 'No máximo 4 fases.';
    let cur = n;
    for (let i = 0; i < specs.length; i++) {
      const s = specs[i], ult = i === specs.length - 1, tag = specs.length > 1 ? ' (fase ' + (i + 1) + ')' : '';
      if (s.tipo === 'mata') {
        if (!ult) return 'O mata-mata precisa ser a última fase.';
        if (i > 0 && !ehPot2(cur)) return 'O mata-mata receberia ' + cur + ' clubes; precisa ser 2, 4, 8, 16 ou 32. Ajuste classificados e extras da fase anterior.';
        break;
      }
      const g = s.grupos;
      if (g > 1 && cur < g * 2) return 'Com ' + g + ' grupos são necessários pelo menos ' + (g * 2) + ' clubes' + tag + '.';
      let menor = Math.floor(cur / g);
      if (i === 0 && s.seed === 'manual' && g > 1) {
        const cont = Array(g).fill(0), man = s.manual || {};
        o.clubes.forEach(id => { const gi = man[id]; if (Number.isInteger(gi) && gi >= 0 && gi < g) cont[gi]++; });
        if (o.clubes.some(id => !(Number.isInteger(man[id]) && man[id] >= 0 && man[id] < g))) return 'Distribua todos os clubes pelos grupos (modo manual).';
        if (Math.min(...cont) < 2) return 'Cada grupo precisa de pelo menos 2 clubes (modo manual).';
        menor = Math.min(...cont);
      }
      if (ult) { if (g > 1) return 'A última fase não pode ter grupos: use grupo único (pontos corridos) ou termine com mata-mata.'; break; }
      if (s.classificam > menor) return 'O menor grupo' + tag + ' terá ' + menor + ' clubes, então só podem se classificar ' + menor + ' por grupo.';
      if (s.extras > 0 && (s.extras > g || s.classificam >= menor)) return 'Melhores colocados extras' + tag + ': no máximo ' + g + ' (um por grupo) e todos os grupos precisam ter mais de ' + s.classificam + ' clubes.';
      const prox = g * s.classificam + s.extras;
      if (prox < 2) return 'Classifique pelo menos 2 clubes' + tag + '.';
      if (prox >= cur) return 'A fase' + tag + ' precisa eliminar clubes: reduza os classificados.';
      cur = prox;
    }
    return '';
  }

  // Resumo em texto do que será gerado (para mostrar no formulário).
  function resumoSpecs(n, specs) {
    const nomes = nomesFases(specs); let cur = n, tot = 0; const partes = [];
    for (let i = 0; i < specs.length; i++) {
      const s = specs[i], ult = i === specs.length - 1;
      if (s.tipo === 'mata') {
        const legs = (s.idaVolta ? 2 : 1), r = Math.max(1, Math.ceil(Math.log2(cur)));
        let j = 0, c = cur; for (let k = 0; k < r; k++) { const tam = c <= 2 ? 2 : Math.pow(2, Math.ceil(Math.log2(c))); const conf = c - tam / 2 > 0 ? c - tam / 2 : 1; const ida = tam > 2 ? s.idaVolta : s.finalIdaVolta; j += conf * (ida ? 2 : 1); c = tam / 2; if (tam === 2 && s.terceiro) j++; }
        void legs; tot += j; partes.push(nomes[i] + ': ' + cur + ' clubes, ' + r + ' rodadas, ' + j + ' jogos'); break;
      }
      const g = s.grupos, tam = Math.floor(cur / g), resto = cur % g;
      const pares = (m) => m * (m - 1) / 2 * (s.returno ? 2 : 1);
      const j = (g - resto) * pares(tam) + resto * pares(tam + 1); tot += j;
      partes.push(nomes[i] + ': ' + (g > 1 ? g + ' grupos de ~' + Math.round(cur / g) : cur + ' clubes') + ', ' + j + ' jogos');
      if (!ult) cur = Math.min(cur, g * s.classificam + s.extras);
    }
    return partes.join(' → ') + ' · total ≈ ' + tot + ' jogos';
  }

  function tabelaDe(jogos, ids, regras) {
    const t = new Map(ids.map(id => [id, { id, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0, sg: 0, pts: 0 }]));
    jogos.forEach(j => {
      if (!j.res || !t.has(j.casa) || !t.has(j.fora)) return;
      const [a, b] = j.res.placar, c = t.get(j.casa), f = t.get(j.fora);
      c.j++; f.j++; c.gm += a; c.gs += b; f.gm += b; f.gs += a;
      if (a > b) { c.v++; f.d++; c.pts += regras.pv; f.pts += regras.pd; }
      else if (a < b) { f.v++; c.d++; f.pts += regras.pv; c.pts += regras.pd; }
      else { c.e++; f.e++; c.pts += regras.pe; f.pts += regras.pe; }
    });
    const nome = id => { const c = Store.get().clubes.find(x => x && x.id === id); return c ? c.nome : ''; };
    const modo = regras && regras.desempate;
    const arr = [...t.values()].map(r => Object.assign(r, { sg: r.gm - r.gs }));
    const padrao = (x, y) => y.pts - x.pts || y.v - x.v || y.sg - x.sg || y.gm - x.gm || nome(x.id).localeCompare(nome(y.id));
    if (modo === 'gols') return arr.sort((x, y) => y.pts - x.pts || y.sg - x.sg || y.gm - x.gm || y.v - x.v || nome(x.id).localeCompare(nome(y.id)));
    arr.sort(padrao);
    if (modo !== 'confronto') return arr;
    // confronto direto entre os empatados em pontos
    const out = []; let i = 0;
    while (i < arr.length) {
      let k = i; while (k < arr.length && arr[k].pts === arr[i].pts) k++;
      const bloco = arr.slice(i, k);
      if (bloco.length > 1) {
        const set = new Set(bloco.map(b => b.id)), mini = new Map(bloco.map(b => [b.id, { p: 0, sg: 0, gm: 0 }]));
        jogos.forEach(jg => {
          if (!jg.res || !set.has(jg.casa) || !set.has(jg.fora)) return;
          const [a, b] = jg.res.placar, c = mini.get(jg.casa), f = mini.get(jg.fora);
          c.gm += a; f.gm += b; c.sg += a - b; f.sg += b - a;
          if (a > b) c.p += regras.pv; else if (a < b) f.p += regras.pv; else { c.p += regras.pe; f.p += regras.pe; }
        });
        bloco.sort((x, y) => { const mx = mini.get(x.id), my = mini.get(y.id); return my.p - mx.p || my.sg - mx.sg || my.gm - mx.gm || padrao(x, y); });
      }
      out.push(...bloco); i = k;
    }
    return out;
  }

  // Pênaltis: cinco cobranças para cada lado e, se persistir o empate, cobranças alternadas.
  function disputaPenaltis(idCasa, idFora) {
    if (typeof idCasa === 'string' && idCasa.startsWith('w_')) return wnPenaltisIds(idCasa, idFora); // atletas do modo Renniw
    const info = id => {
      const p = prepararTime(id);
      if (!p.ok) return { cobr: [70, 70, 70, 70, 70], gk: 70 };
      const t = p.prep.titulares.map(x => ({ x, j: p.prep.elenco.find(e => e.id === x.jogadorId) })).filter(o => o.j);
      const gk = t.find(o => o.x.slotPos === 'GOL');
      const cobr = t.filter(o => o !== gk).sort((a, b) => (b.j.attr.fin || 0) - (a.j.attr.fin || 0)).map(o => o.j.attr.fin || 60);
      return { cobr: cobr.length ? cobr : [70], gk: gk ? (gk.j.attr.gol || 60) : 60 };
    };
    const I = [info(idCasa), info(idFora)];
    const gol = (t, k) => Math.random() < Math.min(0.92, Math.max(0.5, 0.74 + (I[t].cobr[k % I[t].cobr.length] - 70) * 0.004 - (I[1 - t].gk - 70) * 0.003));
    const p = [0, 0];
    for (let k = 0; k < 5; k++) {
      [0, 1].forEach(t => { if (gol(t, k)) p[t]++; });
      const restam = 4 - k;
      if (p[0] > p[1] + restam || p[1] > p[0] + restam) break;
    }
    let k = 5;
    while (p[0] === p[1] && k < 40) { const a = gol(0, k), b = gol(1, k); if (a) p[0]++; if (b) p[1]++; k++; }
    if (p[0] === p[1]) p[Math.random() < 0.5 ? 0 : 1]++;
    return p;
  }

  function confrontoDecidido(fase, conf) {
    const js = fase.jogos.filter(j => j.conf === conf.id);
    if (!js.length || js.some(j => !j.res)) return null;
    const g = { [conf.a]: 0, [conf.b]: 0 }, fora = { [conf.a]: 0, [conf.b]: 0 };
    js.forEach(j => { g[j.casa] += j.res.placar[0]; g[j.fora] += j.res.placar[1]; fora[j.fora] += j.res.placar[1]; });
    if (g[conf.a] !== g[conf.b]) return { vencedor: g[conf.a] > g[conf.b] ? conf.a : conf.b, agregado: g, penaltis: null };
    if (fase.cfg && fase.cfg.golFora && js.length === 2 && fora[conf.a] !== fora[conf.b]) return { vencedor: fora[conf.a] > fora[conf.b] ? conf.a : conf.b, agregado: g, penaltis: null, golFora: true };
    const ult = js.slice().reverse().find(j => j.res.penaltis);
    if (!ult) return null;
    const [pc, pf] = ult.res.penaltis;
    return { vencedor: pc > pf ? ult.casa : ult.fora, agregado: g, penaltis: ult };
  }

  // Quem avança de uma fase de liga/grupos: os 'classificam' melhores de cada grupo + os 'extras' melhores do colocado seguinte.
  function classificadosDe(comp, fase, spec) {
    const rows = [];
    fase.grupos.forEach((g, gi) => tabelaDe(fase.jogos.filter(j => j.grupo === gi), g.clubes, comp.regras).forEach((r, i) => rows.push(Object.assign({}, r, { rank: i, grupo: gi }))));
    const k = spec.classificam, m = spec.extras;
    const cmp = (a, b) => a.rank - b.rank || b.pts - a.pts || b.sg - a.sg || b.gm - a.gm;
    const base = rows.filter(r => r.rank < k), ext = rows.filter(r => r.rank === k).sort(cmp).slice(0, m);
    return { lista: base.concat(ext).sort(cmp), rows, G: fase.grupos.length, k, m };
  }

  function proximaFase(prox, cls, nome, regras) {
    if (prox.tipo === 'liga') return faseLiga(cls.lista.map(r => r.id), prox, prox.grupos, nome);
    const { lista, rows, G, k, m } = cls;
    if (G > 1 && m === 0) {
      // 1º de um grupo enfrenta o 2º de outro
      const q = []; for (let g = 0; g < G; g++) q.push(rows.filter(r => r.grupo === g && r.rank < k).map(r => r.id));
      const ordem = [];
      for (let r = 0; r < Math.ceil(k / 2); r++) for (let g = 0; g < G; g++) {
        const alto = q[g][r], baixo = q[(g + 1) % G][k - 1 - r];
        if (alto != null) ordem.push(alto);
        if (baixo != null && baixo !== alto) ordem.push(baixo);
      }
      return faseMata([...new Set(ordem)], prox, nome);
    }
    if (ehPot2(lista.length)) {
      const arr = ordemChave(lista.length).map(s => lista[s - 1]);
      if (G > 1) evitarMesmoGrupo(arr);
      return faseMata(arr.map(r => r.id), prox, nome);
    }
    return faseMata(lista.map(r => r.id), prox, nome);
  }

  // Depois de cada resultado: fecha confrontos empatados (pênaltis), abre a próxima rodada ou fase e define o campeão.
  function avancarCompeticao(comp) {
    const specs = specsDe(comp), nomes = nomesFases(specs);
    for (let guarda = 0; guarda < 20 && comp.status === 'andamento'; guarda++) {
      const idx = comp.fases.length - 1, fase = comp.fases[idx], spec = specs[Math.min(idx, specs.length - 1)];
      if (fase.tipo === 'mata') {
        const cfg = fase.cfg || { idaVolta: !!(comp.regras && comp.regras.idaVolta) };
        const rod = fase.rodadasMata[fase.rodadasMata.length - 1];
        rod.confrontos.forEach(conf => {
          const js = fase.jogos.filter(j => j.conf === conf.id);
          if (js.length && js.every(j => j.res) && !confrontoDecidido(fase, conf)) {
            const ult = js[js.length - 1];
            ult.res.penaltis = disputaPenaltis(ult.casa, ult.fora);
          }
        });
        const decididos = rod.confrontos.map(c => confrontoDecidido(fase, c));
        if (decididos.some(d => !d)) return;
        const prin = rod.confrontos.map((c, i) => ({ c, d: decididos[i] })).filter(x => !x.c.terceiro);
        const passam = rod.diretos.concat(prin.map(x => x.d.vencedor));
        if (passam.length === 1) { fase.concluida = true; comp.status = 'encerrada'; comp.campeaoId = passam[0]; return; }
        const perd = cfg.terceiro && passam.length === 2 && prin.length === 2 ? prin.map(x => x.d.vencedor === x.c.a ? x.c.b : x.c.a) : null;
        rodadaMata(fase, passam, cfg, perd);
        continue;
      }
      if (fase.jogos.some(j => !j.res)) return;
      fase.concluida = true;
      if (idx >= specs.length - 1) {
        comp.status = 'encerrada';
        const t = tabelaDe(fase.jogos, fase.grupos[0].clubes, comp.regras);
        comp.campeaoId = t[0] ? t[0].id : null;
        return;
      }
      comp.fases.push(proximaFase(specs[idx + 1], classificadosDe(comp, fase, spec), nomes[idx + 1] || 'Fase ' + (idx + 2), comp.regras));
    }
  }

  const compAchar = (st, id) => st.competicoes.find(c => c && c.id === id);
  const compJogo = (comp, jid) => { for (const f of comp.fases) { const j = f.jogos.find(x => x.id === jid); if (j) return { fase: f, jogo: j }; } return null; };
  const compFaseAtual = comp => comp.fases[comp.fases.length - 1];

  // Primeira rodada com jogos pendentes (a perna de volta só abre depois da ida).
  function jogosJogaveis(comp) {
    const f = compFaseAtual(comp);
    if (!f || comp.status !== 'andamento') return [];
    const pend = f.jogos.filter(j => !j.res);
    if (!pend.length) return [];
    const r = Math.min(...pend.map(j => j.rodada));
    return pend.filter(j => j.rodada === r && (j.perna !== 2 || f.jogos.some(x => x.conf === j.conf && x.perna === 1 && x.res)));
  }

  // Grava o resultado de um jogo da competição (usado tanto ao assistir quanto ao simular).
  function registrarResultado(compId, jogoId, reg) {
    let info = null;
    Store.update(st => {
      const comp = compAchar(st, compId); if (!comp) return;
      const a = compJogo(comp, jogoId); if (!a || a.jogo.res) return;
      a.jogo.res = { placar: [reg.placar[0], reg.placar[1]], penaltis: null, partidaId: reg.id };
      reg.jogadores.forEach(j => {
        const key = j.id || (j.nome + j.ti);
        const e = comp.stats[key] || (comp.stats[key] = { nome: j.nome, clube: reg.times[j.ti].nome, clubeId: reg.times[j.ti].id, pos: j.pos, gols: 0, ass: 0, j: 0 });
        e.nome = j.nome; e.clube = reg.times[j.ti].nome; e.clubeId = reg.times[j.ti].id; e.gols += j.gols; e.ass += j.ass; e.j++;
      });
      const antes = comp.status;
      avancarCompeticao(comp);
      const j2 = compJogo(comp, jogoId).jogo;
      info = { penaltis: j2.res.penaltis, campeaoId: comp.status === 'encerrada' && antes !== 'encerrada' ? comp.campeaoId : null, nome: comp.nome, fase: a.fase.nome };
    });
    if (info) { try { mundoPosJogo(compId, jogoId, reg, info); } catch (e) { console.error(e); } carreiraPosResultado(compId, jogoId, reg); }
    return info;
  }

  function nomeDaClubeComp(comp, id) {
    const c = Store.get().clubes.find(x => x && x.id === id);
    return c ? c.nome : ((comp.nomes && comp.nomes[id] && comp.nomes[id].nome) || 'Clube removido');
  }
  function rotuloJogoComp(comp, fase, jogo) {
    if (fase.tipo === 'liga') return fase.nome + (fase.grupos.length > 1 ? ' · ' + fase.grupos[jogo.grupo].nome : '') + ' · Rodada ' + jogo.rodada;
    const rod = fase.rodadasMata[jogo.rodada - 1], cf = rod && rod.confrontos.find(x => x.id === jogo.conf);
    return (cf && cf.terceiro ? 'Disputa do 3º lugar' : rod ? rod.nome : 'Mata-mata') + (jogo.perna ? ' · ' + (jogo.perna === 1 ? 'Ida' : 'Volta') : '');
  }

  // Simula um jogo da competição sem assistir (gestão automática dos dois times).
  function simularJogoComp(compId, jogoId) {
    const comp = compAchar(Store.get(), compId); if (!comp) return { ok: false, erro: 'Competição não encontrada.' };
    const a = compJogo(comp, jogoId); if (!a || a.jogo.res) return { ok: false, erro: 'Jogo indisponível.' };
    const pa = prepararTime(a.jogo.casa), pb = prepararTime(a.jogo.fora);
    if (!pa.ok) return { ok: false, erro: pa.erro };
    if (!pb.ok) return { ok: false, erro: pb.erro };
    const m = criarPartida(pa.prep, pb.prep);
    aplicarFocoCarreira(m);
    simularAteOFim(m);
    const reg = registroDe(m);
    reg.temporada = m.temporada; reg.competicaoId = compId; reg.competicao = comp.nome + ' · ' + rotuloJogoComp(comp, a.fase, a.jogo);
    reg.eventos = reg.eventos.filter(e => ['gol', 'amarelo', 'vermelho', 'lesao', 'sub', 'penalti'].includes(e.tipo));
    Store.update(st => { st.partidas.push(reg); if (st.partidas.length > MAX_PARTIDAS) st.partidas = st.partidas.slice(-MAX_PARTIDAS); });
    const info = registrarResultado(compId, jogoId, reg);
    return { ok: true, info, reg };
  }

  function iniciarJogoCompeticao(comp, jogo) {
    const a = prepararTime(jogo.casa), b = prepararTime(jogo.fora);
    if (!a.ok || !b.ok) { UI.toast((!a.ok ? a.erro : b.erro), true); return false; }
    pararRelogio();
    live.m = criarPartida(a.prep, b.prep);
    aplicarFocoCarreira(live.m);
    live.vel = 1;
    live.ctx = { compId: comp.id, jogoId: jogo.id };
    location.hash = 'partida';
    return true;
  }

  function compSegura(c) {
    if (!c || typeof c !== 'object' || typeof c.id !== 'string' || !Array.isArray(c.fases) || !c.fases.length || !Array.isArray(c.clubes)) return null;
    if (!c.fases.every(f => f && Array.isArray(f.jogos) && Array.isArray(f.grupos || []) && (f.tipo === 'liga' || f.tipo === 'mata'))) return null;
    c.stats = c.stats && typeof c.stats === 'object' ? c.stats : {};
    c.nomes = c.nomes && typeof c.nomes === 'object' ? c.nomes : {};
    c.regras = Object.assign({ pv: 3, pe: 1, pd: 0, returno: false, idaVolta: false, grupos: 2, classificam: 2, desempate: 'padrao' }, c.regras || {});
    c.plano = Array.isArray(c.plano) ? c.plano : [c.fases[0].tipo];
    if (Array.isArray(c.specs)) c.specs = c.specs.map(specSegura);
    c.fases.forEach(f => { f.rodadasMata = Array.isArray(f.rodadasMata) ? f.rodadasMata : []; f.grupos = Array.isArray(f.grupos) ? f.grupos : []; });
    return c;
  }
  const poisson = l => { let k = 0, p = 1; const L = Math.exp(-l); do { k++; p *= Math.random(); } while (p > L); return k - 1; };

  /* ====================================================================
     RENNIW — modo de jogo 1x1, independente da carreira.
     Armazenamento próprio (chave 'renniw:dados'); nunca escreve no Store do Futlab.
     Só lê funções puras do Futlab (pesos de overall, perfis, nomes, nacionalidades, motor de competições).
     ==================================================================== */
  const WN_ESTILOS = { equilibrado: 'Equilibrado', ofensivo: 'Ofensivo', defensivo: 'Defensivo', contra: 'Contra-ataque', posse: 'Posse de bola' };
  const WStore = (() => {
    const KEY = 'renniw:dados', MAX_PARTIDAS = 8000, EVENTOS_RECENTES = 150;
    const padrao = () => ({ v: 1, atletas: [], partidas: [], torneios: [], rivais: [], ligas: [], cfg: { sorte: 'media', narrar: false } });
    let estado = padrao(), timer = null;
    const num = (v, a, b, f) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : f; };
    function atletaSeguro(r) {
      r = (r && typeof r === 'object') ? r : {};
      const a = r.attr || {}, ap = r.ap || {}, attr = {};
      ATRIBUTOS.forEach(([k]) => { attr[k] = num(a[k], 1, 99, 50); });
      return {
        id: String(r.id || ('w_' + novoId())), nome: String(r.nome || 'Atleta').slice(0, 20), sobrenome: String(r.sobrenome || '').slice(0, 24),
        nac: tem(NAC_INFO, r.nac) ? r.nac : 'Brasil', idade: num(r.idade, 15, 45, 24), pe: tem(PES, r.pe) ? r.pe : 'direito',
        estilo: tem(WN_ESTILOS, r.estilo) ? r.estilo : 'equilibrado', attr,
        ap: { pele: PELES.includes(ap.pele) ? ap.pele : PELES[1], cabeloCor: CABELOS.includes(ap.cabeloCor) ? ap.cabeloCor : CABELOS[0], cabeloEstilo: tem(ESTILOS_CABELO, ap.cabeloEstilo) ? ap.cabeloEstilo : 'curto' },
        criadoEm: typeof r.criadoEm === 'string' ? r.criadoEm : new Date().toISOString()
      };
    }
    function partidaSegura(p) {
      if (!p || typeof p !== 'object' || !p.a || !p.b || !Array.isArray(p.placar) || p.placar.length !== 2) return null;
      const lado = l => ({ id: String(l.id || ''), nome: String(l.nome || '').slice(0, 44), nac: tem(NAC_INFO, l.nac) ? l.nac : 'Brasil', ovr: num(l.ovr, 1, 99, 60) });
      return Object.assign({}, p, { id: String(p.id || ''), a: lado(p.a), b: lado(p.b), placar: [num(p.placar[0], 0, 99, 0), num(p.placar[1], 0, 99, 0)], eventos: Array.isArray(p.eventos) ? p.eventos : [], est: Array.isArray(p.est) && p.est.length === 2 ? p.est : [{}, {}] });
    }
    function normalizar(d) {
      const o = padrao(); d = (d && typeof d === 'object') ? d : {};
      o.atletas = (Array.isArray(d.atletas) ? d.atletas : []).map(atletaSeguro).filter(a => a.id);
      o.partidas = (Array.isArray(d.partidas) ? d.partidas : []).map(partidaSegura).filter(Boolean);
      o.torneios = (Array.isArray(d.torneios) ? d.torneios : []).map(t => (t && typeof t === 'object' && typeof compSegura === 'function') ? compSegura(t) : null).filter(Boolean);
      const ids = new Set(o.atletas.map(a => a.id));
      o.rivais = (Array.isArray(d.rivais) ? d.rivais : []).filter(r => Array.isArray(r) && r.length === 2 && ids.has(r[0]) && ids.has(r[1]) && r[0] !== r[1]).map(r => [r[0], r[1]]);
      o.ligas = (Array.isArray(d.ligas) ? d.ligas : []).filter(l => l && typeof l === 'object' && typeof l.id === 'string' && Array.isArray(l.divisoes) && l.divisoes.length && Array.isArray(l.temporadas)).map(l => {
        l.nome = String(l.nome || 'Liga').slice(0, 40);
        l.divisoes = l.divisoes.filter(x => x && typeof x.id === 'string').map(x => ({ id: x.id, nome: String(x.nome || 'Divisão').slice(0, 30), rebaixam: num(x.rebaixam, 0, 10, 0), returno: !!x.returno, mataTop: [0, 2, 4, 8, 16].includes(x.mataTop) ? x.mataTop : 0, idaVolta: !!x.idaVolta, atletas: (Array.isArray(x.atletas) ? x.atletas : []).filter(i => ids.has(i)) }));
        l.temporadas = l.temporadas.filter(t => t && typeof t === 'object' && t.comps && typeof t.comps === 'object').map(t => ({ n: num(t.n, 1, 9999, 1), comps: t.comps, status: t.status === 'encerrada' ? 'encerrada' : 'andamento', campeoes: t.campeoes && typeof t.campeoes === 'object' ? t.campeoes : {}, mov: Array.isArray(t.mov) ? t.mov : [] }));
        return l;
      }).filter(l => l.divisoes.length && l.temporadas.length);
      o.cfg = Object.assign(o.cfg, d.cfg && typeof d.cfg === 'object' ? d.cfg : {});
      if (!['baixa', 'media', 'alta'].includes(o.cfg.sorte)) o.cfg.sorte = 'media';
      return o;
    }
    function carregar() { try { const b = Disco.ler(KEY) || Disco.ler('projetoFutebol:winner'); if (b) estado = normalizar(JSON.parse(b)); } catch (e) { estado = padrao(); } }
    function compactar() {
      const p = estado.partidas;
      if (p.length > MAX_PARTIDAS) p.splice(0, p.length - MAX_PARTIDAS);
      for (let i = 0; i < p.length - EVENTOS_RECENTES; i++) if (p[i].eventos && p[i].eventos.length) p[i].eventos = [];
    }
    function salvarAgora() { clearTimeout(timer); timer = null; compactar(); return Disco.gravar(KEY, JSON.stringify(estado)); }
    function agendar() { clearTimeout(timer); timer = setTimeout(salvarAgora, 300); }
    const get = () => estado;
    function update(fn) { fn(estado); agendar(); }
    function substituir(n) { estado = normalizar(n); salvarAgora(); }
    function exportarJSON() { return JSON.stringify({ app: 'renniw', exportadoEm: new Date().toISOString(), dados: estado }, null, 2); }
    function importarJSON(t) {
      let o; try { o = JSON.parse(t); } catch (e) { throw new Error('O conteúdo não é um JSON válido.'); }
      if (!o || (o.app !== 'renniw' && o.app !== 'futlab-winner') || !o.dados || typeof o.dados !== 'object') throw new Error('Isto não é uma exportação do Renniw.');
      substituir(o.dados);
    }
    window.addEventListener('pagehide', () => { if (timer) salvarAgora(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && timer) salvarAgora(); });
    carregar();
    return { get, update, salvarAgora, substituir, exportarJSON, importarJSON, atletaSeguro, apagar: () => substituir(padrao()) };
  })();

  const wnNome = a => (a.nome + (a.sobrenome ? ' ' + a.sobrenome : '')).trim();
  const wnCurto = a => a.sobrenome || a.nome;
  // Sem posições: um único peso para todos os atletas.
  const WN_PESO = { fin: .18, pas: .15, dri: .15, vel: .12, def: .12, fis: .10, int: .08, res: .06, gol: .04 };
  const wnCalc = a => Math.round(Object.keys(WN_PESO).reduce((t, k) => t + WN_PESO[k] * (Number(a.attr[k]) || 0), 0));
  const wnOvr = a => limitar(wnCalc(a), 1, 99);
  const WN_ORDEM_PESO = Object.keys(WN_PESO).sort((x, y) => WN_PESO[x] - WN_PESO[y]);

  // Atributos iniciais para um overall exato (60 nos atletas novos): cada atleta tem 2 pontos fortes e 2 fracos.
  function wnAtributos(alvo) {
    alvo = limitar(Math.round(alvo), 1, 99);
    const ks = Object.keys(WN_PESO), emb = embaralhar(ks), base = {}, attr = {};
    ks.forEach(k => { base[k] = alvo + (Math.random() * 6 - 3) + (emb.indexOf(k) < 2 ? 9 : emb.indexOf(k) < 4 ? -9 : 0); });
    let desloc = 0;
    for (let i = 0; i < 6; i++) {
      ks.forEach(k => { attr[k] = limitar(Math.round(base[k] + desloc), 1, 99); });
      desloc += alvo - wnCalc({ attr });
    }
    return wnAfinarOverall({ attr }, alvo).attr;
  }
  // Ajuste fino de ±1 nos atributos de menor peso até o overall bater exatamente com o alvo.
  function wnAfinarOverall(a, alvo) {
    const ks = WN_ORDEM_PESO;
    for (let i = 0; i < 800; i++) {
      const o = wnCalc(a); if (o === alvo) break;
