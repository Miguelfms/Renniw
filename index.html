  const wnPct = n => (Math.round(n * 10) / 10).toString().replace('.', ',') + '%';
  const wnFlag = a => bandeira(a.nac);

  function wnExportar(texto, nome) {
    return (async () => {
      let dl = null;
      try { dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
      if (dl) { try { await dl.save({ filename: nome, data: texto }); UI.toast('Arquivo salvo'); return; } catch (err) { if (err && err.code === 'declined') return; } }
      const j = UI.abrir(`<h3>Exportar Renniw</h3><p>Copie o texto abaixo e guarde em um arquivo .json.</p><textarea id="pf-texto" readonly aria-label="Dados exportados"></textarea><div class="linha"><button class="btn" id="pf-fechar">Fechar</button><button class="btn primario" id="pf-copiar">Copiar</button></div>`);
      j.querySelector('#pf-texto').value = texto;
      j.querySelector('#pf-fechar').addEventListener('click', UI.fechar);
      j.querySelector('#pf-copiar').addEventListener('click', async () => { try { await navigator.clipboard.writeText(texto); UI.toast('Copiado'); } catch (e) { j.querySelector('#pf-texto').select(); UI.toast('Selecione e copie o texto', true); } });
    })();
  }

  /* ---------- Renniw: casca e rotas ---------- */
  function telaRenniw(el, h) {
    const esc = UI.esc;
    const aba = h.startsWith('winner-atleta') || h.startsWith('winner-perfil') ? 'winner-atletas' : h.startsWith('winner-liga') ? 'winner-ligas' : h.startsWith('winner-jogo') ? 'winner-historico' : h.startsWith('winner-torneio') ? 'winner-torneios' : (WN_ABAS.some(x => x[0] === h) ? h : 'winner');
    const raiz = document.createElement('div'); raiz.className = 'wn'; el.appendChild(raiz);
    raiz.innerHTML = `<div class="wn-top"><span class="wn-sair">Futebol 1x1</span><span class="wn-logo">${WN_LOGO}<b>RENNIW</b><small>1x1</small></span></div>
      <nav class="wn-tabs" aria-label="Renniw">${WN_ABAS.map(([id, nome]) => `<a href="#${id}" ${id === aba ? 'aria-current="page"' : ''}>${esc(nome)}</a>`).join('')}</nav><div class="wn-corpo"></div>`;
    const corpo = raiz.querySelector('.wn-corpo'), at = raiz.querySelector('[aria-current]'); if (at && at.scrollIntoView) { try { at.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) { /* sem rolagem */ } }
    if (h === 'winner-atletas') wnLista(corpo);
    else if (h === 'winner-atleta-novo') wnEditor(corpo, null);
    else if (h.startsWith('winner-atleta-')) { const id = h.slice(14); if (wnAtleta(id)) wnEditor(corpo, id); else wnLista(corpo); }
    else if (h === 'winner-partida') wnPartida(corpo);
    else if (h.startsWith('winner-jogo-')) wnResultado(corpo, h.slice(12));
    else if (h === 'winner-torneios') wnTorneios(corpo);
    else if (h === 'winner-torneio-novo') wnTorneioNovo(corpo);
    else if (h.startsWith('winner-torneio-')) wnTorneio(corpo, h.slice(15));
    else if (h.startsWith('winner-perfil-')) wnPerfil(corpo, h.slice(14));
    else if (h === 'winner-ligas') wnListaLigas(corpo);
    else if (h === 'winner-liga-novo') wnLigaForm(corpo, null);
    else if (h.startsWith('winner-liga-editar-')) { const id = h.slice(19); if (wnLiga(id)) wnLigaForm(corpo, id); else wnListaLigas(corpo); }
    else if (h.startsWith('winner-liga-')) wnLigaTela(corpo, h.slice(12));
    else if (h === 'winner-ranking') wnRanking(corpo);
    else if (h === 'winner-historico') wnHistorico(corpo);
    else if (h === 'winner-dados') wnDados(corpo);
    else wnInicio(corpo);
  }

  const wnTitulo = (t, sub) => `<h1 class="wn-h1">${UI.esc(t)}</h1>${sub ? `<p class="lead">${UI.esc(sub)}</p>` : ''}`;
  const wnVazioAtletas = acao => UI.vazio('Crie seus atletas', 'O Renniw coloca atletas criados por você para competir, um contra o outro. Todo atleta novo nasce com overall 60 e evolui como você decidir.', null, acao || '<div class="linha" style="margin-top:10px"><a class="btn primario" href="#winner-atleta-novo">Criar atleta</a><button type="button" class="btn" data-wn-gerar="8">Gerar 8 atletas</button></div>');
  function wnGerarVarios(n) { const novos = Array.from({ length: n }, () => wnGerarAtleta({})); WStore.update(w => { novos.forEach(a => w.atletas.push(a)); }); WStore.salvarAgora(); return novos; }

  /* ---------- Renniw: início ---------- */
  function wnInicio(c) {
    const esc = UI.esc, W = WStore.get(), S = wnStats(), at = W.atletas;
    const rank = at.map(a => Object.assign({ a }, S[a.id] || wnVazioStats(a.id))).sort((x, y) => y.rating - x.rating || y.apr - x.apr);
    const ult = W.partidas.slice(-5).reverse(), and = W.torneios.filter(t => t.status === 'andamento' && !t.liga);
    c.innerHTML = `<div class="wn-hero"><span class="hm-eyebrow">Modo 1x1</span><h1 class="hm-titulo">Atleta contra <em>atleta</em></h1><p>Crie jogadores, coloque-os frente a frente e monte torneios. Tudo fica salvo neste aparelho.</p>
        <div class="linha" style="gap:10px"><a class="btn primario hm-btn" href="#winner-partida">Nova partida</a><a class="btn hm-btn" href="#winner-torneio-novo">Novo torneio</a>${wnPromptInstalar && !wnInstalado() ? '<button type="button" class="btn hm-btn" id="h-inst">Instalar app</button>' : ''}</div></div>
      <div class="wn-resumo"><div><b>${at.length}</b><span>atletas</span></div><div><b>${W.partidas.length}</b><span>partidas</span></div><div><b>${W.torneios.length}</b><span>torneios</span></div><div><b>${W.torneios.filter(t => t.status === 'encerrada').length}</b><span>campeões</span></div></div>
      ${at.length < 2 ? wnVazioAtletas() : `
      <section class="secao"><div class="linha" style="justify-content:space-between"><h2>Top do ranking</h2><a class="btn pequeno" href="#winner-ranking">Ver ranking</a></div>
        <div class="lista">${rank.slice(0, 5).map((r, i) => `<a class="item hist" href="#winner-perfil-${esc(r.a.id)}"><div class="wn-pos">${i + 1}</div><div class="wn-mini">${wnAv(r.a)}</div><div class="info"><strong>${wnFlag(r.a)} ${esc(wnNome(r.a))}</strong><small>${r.j} jogos · ${r.v}V ${r.e}E ${r.d}D${r.tit ? ' · 🏆 ' + r.tit : ''}</small></div><div class="wn-rt"><b>${r.rating}</b><small>pts</small></div></a>`).join('')}</div></section>`}
      ${and.length ? `<section class="secao"><h2>Torneios em andamento</h2><div class="lista">${and.map(t => { const tot = t.fases.reduce((x, f) => x + f.jogos.length, 0), ok = t.fases.reduce((x, f) => x + f.jogos.filter(j => j.res).length, 0); return `<a class="item hist" href="#winner-torneio-${esc(t.id)}"><div class="info"><strong>${esc(t.nome)}</strong><small>${t.clubes.length} atletas · ${ok}/${tot} jogos</small></div><span class="chip proxima">Em andamento</span></a>`; }).join('')}</div></section>` : ''}
      ${ult.length ? `<section class="secao"><div class="linha" style="justify-content:space-between"><h2>Últimas partidas</h2><a class="btn pequeno" href="#winner-historico">Histórico</a></div><div class="lista">${ult.map(wnItemPartida).join('')}</div></section>` : ''}`;
    c.addEventListener('click', async e => { const b = e.target.closest('[data-wn-gerar]'); if (b) { wnGerarVarios(Number(b.dataset.wnGerar)); UI.toast('Atletas gerados'); desenhar(false); return; } if (e.target.closest('#h-inst') && wnPromptInstalar) { const pe = wnPromptInstalar; wnPromptInstalar = null; try { await pe.prompt(); await pe.userChoice; } catch (err) { /* cancelado */ } desenhar(false); } });
  }
  function wnItemPartida(p) {
    const esc = UI.esc, pen = p.penaltis ? ` (${p.penaltis[0]}-${p.penaltis[1]} pên.)` : '';
    return `<a class="item hist" href="#winner-jogo-${esc(p.id)}"><div class="info"><strong>${p.rival ? '🔥 ' : ''}${bandeira(p.a.nac)} ${esc(p.a.nome)} <span class="wn-placar">${p.placar[0]} x ${p.placar[1]}</span> ${esc(p.b.nome)} ${bandeira(p.b.nac)}</strong><small>${esc(p.tipo === 'torneio' ? (p.torneio + ' · ' + p.fase) : 'Amistoso')}${esc(pen)}${p.prorr ? ' · prorrogação' : ''} · ${esc(wnData(p.t))}</small></div></a>`;
  }

  /* ---------- Renniw: atletas ---------- */
  const wnFiltro = { busca: '', ordem: 'ovr' };
  function wnLista(c) {
    const esc = UI.esc, W = WStore.get();
    const S = wnStats();
    c.innerHTML = wnTitulo('Atletas', 'Crie, edite e gere atletas. Todo atleta novo começa com overall 60.') + (W.atletas.length ? `<div class="barra-topo"><a class="btn primario" href="#winner-atleta-novo">Novo atleta</a><button type="button" class="btn" id="wn-gerar">Gerar atletas</button></div>
      <div class="linha" style="gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px">
        <div class="campo" style="margin:0"><label>Buscar<input type="search" id="wn-busca" value="${esc(wnFiltro.busca)}" placeholder="Nome" autocomplete="off"></label></div>
        <div class="campo" style="margin:0"><label>Ordenar<select id="wn-ford">${[['ovr', 'Overall'], ['nome', 'Nome'], ['rating', 'Ranking'], ['recente', 'Mais recentes']].map(([k, v]) => `<option value="${k}" ${wnFiltro.ordem === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div></div><div id="wn-grade"></div>` : wnVazioAtletas());
    function grade() {
      const q = semAcento(wnFiltro.busca.trim());
      let l = W.atletas.filter(a => (!q || semAcento(wnNome(a)).includes(q)));
      const o = wnFiltro.ordem;
      l = l.slice().sort((x, y) => o === 'nome' ? wnNome(x).localeCompare(wnNome(y)) : o === 'rating' ? ((S[y.id] || {}).rating || 1000) - ((S[x.id] || {}).rating || 1000) : o === 'recente' ? y.criadoEm.localeCompare(x.criadoEm) : wnOvr(y) - wnOvr(x));
      const g = c.querySelector('#wn-grade'); if (!g) return;
      g.innerHTML = l.length ? `<div class="wn-grade">${l.map(a => { const s = S[a.id] || wnVazioStats(a.id); return `<a class="wn-card" href="#winner-perfil-${esc(a.id)}"><div class="wn-card-av">${wnAv(a)}</div><div class="wn-card-info"><strong>${wnFlag(a)} ${esc(wnNome(a))}</strong><small>${a.idade} anos · pé ${esc(PES[a.pe].toLowerCase())}</small><small>${s.j} jogos · ${s.v}V ${s.e}E ${s.d}D${s.tit ? ' · 🏆 ' + s.tit : ''}</small></div>${wnOvrChip(wnOvr(a))}</a>`; }).join('')}</div>` : '<div class="bloco">Nenhum atleta com esse filtro.</div>';
    }
    if (!W.atletas.length) { c.addEventListener('click', e => { const b = e.target.closest('[data-wn-gerar]'); if (b) { wnGerarVarios(Number(b.dataset.wnGerar)); UI.toast('Atletas gerados'); wnLista(c); } }); return; }
    grade();
    c.addEventListener('input', e => { if (e.target.id === 'wn-busca') { wnFiltro.busca = e.target.value; grade(); } });
    c.addEventListener('change', e => { if (e.target.id === 'wn-ford') { wnFiltro.ordem = e.target.value; grade(); } });
    c.addEventListener('click', e => {
      if (!e.target.closest('#wn-gerar')) return;
      const j = UI.abrir(`<h3>Gerar atletas</h3><p>Os atletas gerados começam com overall 60, com atributos de acordo com a posição.</p>
        <div class="campos"><div class="campo"><label>Quantidade<input type="number" id="wg-n" value="8" min="1" max="50" inputmode="numeric"></label></div></div>
        <div class="linha"><button class="btn" id="wg-c">Cancelar</button><button class="btn primario" id="wg-ok">Gerar</button></div>`);
      j.addEventListener('mousedown', ev => { if (ev.target.closest('button')) ev.preventDefault(); });
      j.querySelector('#wg-c').addEventListener('click', UI.fechar);
      j.querySelector('#wg-ok').addEventListener('click', () => { const n = Math.max(1, Math.min(50, Math.round(Number(j.querySelector('#wg-n').value) || 1))); wnGerarVarios(n); UI.fechar(); UI.toast(n + (n === 1 ? ' atleta gerado' : ' atletas gerados')); wnLista(c); });
    });
  }

  function wnEditor(c, id) {
    const esc = UI.esc, novo = !id;
    const base = novo ? wnGerarAtleta({}) : clone(wnAtleta(id));
    if (novo) { base.nome = ''; base.sobrenome = ''; }
    const ed = base; let tocado = !novo;
    const stats = novo ? null : (wnStats()[id] || wnVazioStats(id));
    const sw = (lista, sel, k) => lista.map((v, i) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${k} ${i + 1}</option>`).join('');
    c.innerHTML = `<a class="voltar" href="#winner-atletas">← Atletas</a>${wnTitulo(novo ? 'Novo atleta' : wnNome(ed), novo ? 'Todo atleta novo começa com overall 60. Edite os atributos como quiser.' : '')}
      <section class="secao"><div class="wn-ed-top"><div class="wn-ed-av" id="e-av"></div><div class="wn-ed-ovr"><span>Overall</span><b id="e-ovr">60</b></div></div>
        <div class="campos">
          <div class="campo"><label>Nome<input type="text" id="e-nome" maxlength="20" value="${esc(ed.nome)}" autocomplete="off"></label></div>
          <div class="campo"><label>Sobrenome<input type="text" id="e-sob" maxlength="24" value="${esc(ed.sobrenome)}" autocomplete="off"></label></div>
          <div class="campo"><label>Nacionalidade<select id="e-nac">${Object.entries(NAC_OPCOES).map(([k, v]) => `<option value="${esc(k)}" ${k === ed.nac ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label></div>
          <div class="campo"><label>Idade<input type="number" id="e-idade" min="15" max="45" value="${ed.idade}" inputmode="numeric"></label></div>
          <div class="campo"><label>Pé dominante<select id="e-pe">${Object.entries(PES).map(([k, v]) => `<option value="${k}" ${k === ed.pe ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
          <div class="campo"><label>Estilo de jogo<select id="e-est">${Object.entries(WN_ESTILOS).map(([k, v]) => `<option value="${k}" ${k === ed.estilo ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
        </div>
        <details style="margin-top:12px"><summary>Aparência</summary><div class="campos" style="margin-top:10px">
          <div class="campo"><label>Tom de pele<select id="e-pele">${sw(PELES, ed.ap.pele, 'Tom')}</select></label></div>
          <div class="campo"><label>Cor do cabelo<select id="e-cab">${sw(CABELOS, ed.ap.cabeloCor, 'Cor')}</select></label></div>
          <div class="campo"><label>Cabelo<select id="e-cest">${Object.entries(ESTILOS_CABELO).map(([k, v]) => `<option value="${k}" ${k === ed.ap.cabeloEstilo ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div></div></details></section>
      <section class="secao"><h2>Atributos</h2><p class="dica">De 1 a 99. O overall é calculado a partir deles, com pesos que mudam conforme a posição.</p>
        <div class="wn-attrs">${ATRIBUTOS.map(([k, nome]) => `<div class="wn-attr" data-k="${k}"><label for="r-${k}">${esc(nome)}<small class="peso"></small></label><input type="range" id="r-${k}" min="1" max="99" value="${ed.attr[k]}"><input type="number" id="n-${k}" min="1" max="99" value="${ed.attr[k]}" inputmode="numeric" aria-label="${esc(nome)}"></div>`).join('')}</div>
        <div class="linha" style="margin-top:14px;gap:10px;flex-wrap:wrap;align-items:flex-end">
          <div class="campo" style="margin:0"><label>Ajustar overall para<input type="number" id="e-alvo" min="1" max="99" value="60" inputmode="numeric" style="max-width:110px"></label></div>
          <button type="button" class="btn" id="e-ajustar">Ajustar overall</button><button type="button" class="btn" id="e-reset">Redefinir atributos (overall 60)</button></div></section>
      ${stats && stats.j ? `<section class="secao"><h2>Carreira no Renniw</h2><p>${stats.j} jogos · ${stats.v}V ${stats.e}E ${stats.d}D · ${stats.gols} gols · ${stats.ass} assistências · aproveitamento ${wnPct(stats.apr)} · ranking ${stats.rating}${stats.tit ? ' · 🏆 ' + stats.tit + ' título(s)' : ''}</p></section>` : ''}
      <div class="linha" style="gap:8px;flex-wrap:wrap"><button type="button" class="btn primario" id="e-salvar">${novo ? 'Criar atleta' : 'Salvar'}</button>${novo ? '<button type="button" class="btn" id="e-aleat">Gerar aleatório</button>' : '<button type="button" class="btn perigo" id="e-excluir">Excluir atleta</button>'}</div>`;
    const q = s => c.querySelector(s);
    function atualizar() {
      ATRIBUTOS.forEach(([k]) => { q('#r-' + k).value = ed.attr[k]; q('#n-' + k).value = ed.attr[k]; });
      const pesos = WN_PESO;
      c.querySelectorAll('.wn-attr').forEach(r => { const w = pesos[r.dataset.k]; r.classList.toggle('sem-peso', !w); r.querySelector('.peso').textContent = w ? ' · peso ' + Math.round(w * 100) + '%' : ' · não conta nesta posição'; });
      const o = wnOvr(ed); q('#e-ovr').textContent = o; q('#e-ovr').parentElement.className = 'wn-ed-ovr ' + ovrClasse(o);
      q('#e-av').innerHTML = wnAv(ed);
    }
    function lerCampos() {
      ed.nome = q('#e-nome').value.trim(); ed.sobrenome = q('#e-sob').value.trim(); ed.nac = q('#e-nac').value; ed.idade = Math.max(15, Math.min(45, Math.round(Number(q('#e-idade').value) || 24)));
      ed.pe = q('#e-pe').value; ed.estilo = q('#e-est').value; ed.ap = { pele: q('#e-pele').value, cabeloCor: q('#e-cab').value, cabeloEstilo: q('#e-cest').value };
    }
    c.addEventListener('input', e => {
      const t = e.target, m = /^[rn]-(\w+)$/.exec(t.id || '');
      if (m && ed.attr[m[1]] != null) { const v = Math.max(1, Math.min(99, Math.round(Number(t.value) || 1))); ed.attr[m[1]] = v; tocado = true; const o = t.id[0] === 'r' ? q('#n-' + m[1]) : q('#r-' + m[1]); o.value = v; const ov = wnOvr(ed); q('#e-ovr').textContent = ov; q('#e-ovr').parentElement.className = 'wn-ed-ovr ' + ovrClasse(ov); }
    });
    c.addEventListener('change', e => {
      const t = e.target;
      if (['e-pele', 'e-cab', 'e-cest'].includes(t.id)) { lerCampos(); atualizar(); }
      else if (/^n-/.test(t.id || '')) { t.value = ed.attr[t.id.slice(2)]; }
    });
    c.addEventListener('click', async e => {
      if (e.target.closest('#e-ajustar')) { lerCampos(); wnAjustarOverall(ed, Math.round(Number(q('#e-alvo').value) || 60)); tocado = true; atualizar(); return; }
      if (e.target.closest('#e-reset')) { ed.attr = wnAtributos(60); tocado = novo ? false : true; atualizar(); return; }
      if (e.target.closest('#e-aleat')) { const g = wnGerarAtleta({}); Object.assign(ed, g, { id: ed.id }); tocado = false; c.querySelector('#e-nome').value = ed.nome; c.querySelector('#e-sob').value = ed.sobrenome; q('#e-nac').value = ed.nac; q('#e-idade').value = ed.idade; q('#e-pe').value = ed.pe; q('#e-pele').value = ed.ap.pele; q('#e-cab').value = ed.ap.cabeloCor; q('#e-cest').value = ed.ap.cabeloEstilo; atualizar(); return; }
      if (e.target.closest('#e-salvar')) {
        lerCampos();
        if (!ed.nome) { UI.toast('Dê um nome ao atleta', true); q('#e-nome').focus(); return; }
        const seguro = WStore.atletaSeguro(ed);
        WStore.update(w => { if (novo) w.atletas.push(seguro); else { const i = w.atletas.findIndex(x => x.id === id); if (i >= 0) w.atletas[i] = Object.assign(seguro, { id, criadoEm: w.atletas[i].criadoEm }); } });
        WStore.salvarAgora(); UI.toast(novo ? 'Atleta criado' : 'Atleta salvo'); location.hash = 'winner-atletas'; return;
      }
      if (e.target.closest('#e-excluir')) {
        if ((WStore.get().ligas || []).some(l => l.divisoes.some(d => d.atletas.includes(id)))) { UI.toast('Esse atleta está em uma liga. Tire-o da liga antes de excluir.', true); return; }
        if (WStore.get().torneios.some(t => t.status === 'andamento' && t.clubes.includes(id))) { UI.toast('Esse atleta está em um torneio em andamento.', true); return; }
        if (await UI.perguntar('Excluir atleta?', wnNome(ed) + ' será removido. As partidas antigas continuam no histórico.', 'Excluir', true)) { WStore.update(w => { w.atletas = w.atletas.filter(x => x.id !== id); }); WStore.salvarAgora(); UI.toast('Atleta excluído'); location.hash = 'winner-atletas'; }
      }
    });
    atualizar();
  }

  /* ---------- Renniw: partida ---------- */
  function wnSeletor(rotulo, chave, lista, S) {
    const esc = UI.esc;
    return `<div class="campo"><label>${rotulo}<select data-sel="${chave}"><option value="">Escolher atleta…</option>${lista.map(a => `<option value="${esc(a.id)}" ${wnSel[chave] === a.id ? 'selected' : ''}>${esc(wnNome(a))} · ${wnOvr(a)}</option>`).join('')}</select></label></div>`;
  }
  function wnCardLado(a, S) {

  function wnListaLigas(c) {
    const esc = UI.esc, ls = wnLigas().slice().reverse();
    c.innerHTML = wnTitulo('Ligas', 'Campeonatos com várias divisões, acesso e descenso. Cada temporada termina e você continua a liga com um toque.') + `<div class="barra-topo"><a class="btn primario" href="#winner-liga-novo">Nova liga</a></div>` + (ls.length ? `<div class="lista">${ls.map(l => `<a class="item hist" href="#winner-liga-${esc(l.id)}"><div class="info"><strong>${esc(l.nome)}</strong><small>${l.divisoes.length} divisões · ${l.divisoes.reduce((s, d) => s + d.atletas.length, 0)} atletas · temporada ${wnLigaAtual(l) ? wnLigaAtual(l).n : '—'}</small></div><span class="chip ${wnLigaTerminou(l) ? '' : 'proxima'}">${wnLigaTerminou(l) ? 'Fim da temporada' : 'Em andamento'}</span></a>`).join('')}</div>` : UI.vazio('Nenhuma liga ainda', 'Crie divisões com nome próprio, defina quantos sobem, descem e vão ao mata-mata.', null, ''));
  }

  const wnLF = { id: null, nome: '', divisoes: [], atr: {} };
  function wnLigaForm(c, editId) {
    const esc = UI.esc, W = WStore.get(), at = W.atletas.slice().sort((a, b) => wnOvr(b) - wnOvr(a));
    if (at.length < 4) { c.innerHTML = `<a class="voltar" href="#winner-ligas">← Ligas</a>` + wnTitulo('Nova liga') + wnVazioAtletas(); c.addEventListener('click', e => { const b = e.target.closest('[data-wn-gerar]'); if (b) { wnGerarVarios(Number(b.dataset.wnGerar)); desenhar(false); } }); return; }
    const F = wnLF, liga = editId ? wnLiga(editId) : null;
    if (F.id !== (editId || 'novo')) {
      F.id = editId || 'novo';
      if (liga) { F.nome = liga.nome; F.divisoes = liga.divisoes.map(d => ({ id: d.id, nome: d.nome, rebaixam: d.rebaixam, returno: !!d.returno, mataTop: d.mataTop, idaVolta: !!d.idaVolta })); F.atr = {}; liga.divisoes.forEach(d => d.atletas.forEach(id => { F.atr[id] = d.id; })); }
      else { F.nome = ''; F.divisoes = [{ id: 'd' + novoId(), nome: 'Série A', rebaixam: 2, returno: true, mataTop: 0, idaVolta: false }, { id: 'd' + novoId(), nome: 'Série B', rebaixam: 0, returno: true, mataTop: 0, idaVolta: false }]; F.atr = {}; }
    }
    const t0 = liga && wnLigaAtual(liga), jogou = !!t0 && liga.divisoes.some(d => { const cc = wnCompDe(t0.comps[d.id]); return cc && cc.fases.some(f => f.jogos.some(j => j.res)); });
    const membrosLivres = !liga || !jogou;
    const distribuir = modo => { const ids = (modo === 'ovr' ? at : embaralhar(at)).map(a => a.id), nd = F.divisoes.length, base = Math.floor(ids.length / nd), resto = ids.length % nd; F.atr = {}; let i = 0; F.divisoes.forEach((d, k) => { const q = base + (k < resto ? 1 : 0); ids.slice(i, i + q).forEach(id => { F.atr[id] = d.id; }); i += q; }); };
    if (membrosLivres && !Object.keys(F.atr).some(id => wnAtleta(id))) distribuir('ovr');
    function calcErro() {
      const cont = {}; F.divisoes.forEach(d => { cont[d.id] = 0; }); at.forEach(a => { if (cont[F.atr[a.id]] != null) cont[F.atr[a.id]]++; });
      const rascunho = { divisoes: F.divisoes.map(d => Object.assign({}, d, { atletas: membrosLivres ? at.filter(a => F.atr[a.id] === d.id).map(a => a.id) : ((liga.divisoes.find(x => x.id === d.id) || {}).atletas || []) })) };
      if (!membrosLivres) rascunho.divisoes.forEach(d => { cont[d.id] = d.atletas.length; });
      let erro = !F.nome.trim() ? 'Dê um nome à liga.' : F.divisoes.some(d => !d.nome.trim()) ? 'Toda divisão precisa de um nome.' : wnLigaErro(rascunho);
      F.divisoes.forEach((d, k) => { if (!erro && k < F.divisoes.length - 1 && d.rebaixam > Math.min(cont[d.id], cont[F.divisoes[k + 1].id]) - 1) erro = `Rebaixados de "${d.nome}": no máximo ${Math.max(0, Math.min(cont[d.id], cont[F.divisoes[k + 1].id]) - 1)}.`; });
      return { erro, cont };
    }
    function montar() {
      const { erro, cont } = calcErro();
      c.innerHTML = `<a class="voltar" href="${liga ? '#winner-liga-' + esc(liga.id) : '#winner-ligas'}">← ${liga ? 'Liga' : 'Ligas'}</a>${wnTitulo(liga ? 'Editar liga' : 'Nova liga')}
        <section class="secao"><div class="campo"><label>Nome da liga<input type="text" id="l-nome" maxlength="40" value="${esc(F.nome)}" placeholder="Ex.: Liga Renniw"></label></div></section>
        <section class="secao"><div class="linha" style="justify-content:space-between;align-items:center"><h2>Divisões <span class="chip">${F.divisoes.length}</span></h2><button type="button" class="btn pequeno" id="l-add" ${F.divisoes.length >= 6 || !membrosLivres ? 'disabled' : ''}>+ Divisão</button></div>
          ${F.divisoes.map((d, k) => `<div class="wn-div" data-d="${esc(d.id)}"><div class="linha" style="gap:8px;align-items:flex-end"><div class="campo" style="flex:1"><label>${k + 1}ª divisão<input type="text" data-f="nome" value="${esc(d.nome)}" maxlength="30" placeholder="Nome da divisão"></label></div>${F.divisoes.length > 2 && membrosLivres ? `<button type="button" class="btn pequeno perigo" data-del="${esc(d.id)}" aria-label="Remover divisão">✕</button>` : ''}</div>
            <div class="campos"><div class="campo"><label>Vão ao mata-mata<select data-f="mataTop">${[[0, 'Ninguém (campeão = líder)'], [2, 'Top 2 (final)'], [4, 'Top 4'], [8, 'Top 8'], [16, 'Top 16']].map(([v, n]) => `<option value="${v}" ${d.mataTop === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
            ${k < F.divisoes.length - 1 ? `<div class="campo"><label>Descem para "${esc(F.divisoes[k + 1].nome || '…')}"<input type="number" data-f="rebaixam" min="0" max="10" value="${d.rebaixam}" inputmode="numeric"></label></div>` : '<div class="campo"><small class="dica">Última divisão: os que sobem são os mesmos que descem da de cima.</small></div>'}</div>
            <label class="wn-chk"><input type="checkbox" data-f="returno" ${d.returno ? 'checked' : ''}> Turno e returno</label>${d.mataTop ? `<label class="wn-chk"><input type="checkbox" data-f="idaVolta" ${d.idaVolta ? 'checked' : ''}> Mata-mata em ida e volta</label>` : ''}<small class="dica">${cont[d.id]} atletas${k > 0 ? ` · sobem ${F.divisoes[k - 1].rebaixam} para "${esc(F.divisoes[k - 1].nome || '…')}"` : ''}</small></div>`).join('')}</section>
        ${membrosLivres ? `<section class="secao"><div class="linha" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><h2>Atletas por divisão</h2><div class="linha"><button type="button" class="btn pequeno" data-dist="ovr">Por overall</button><button type="button" class="btn pequeno" data-dist="rand">Aleatório</button></div></div>
          <div class="wn-lista-sel">${at.map(a => `<label class="wn-opt"><span>${wnFlag(a)} ${esc(wnNome(a))}</span>${wnOvrChip(wnOvr(a))}<select data-at="${esc(a.id)}" style="width:auto;min-height:34px"><option value="">fora</option>${F.divisoes.map(d => `<option value="${esc(d.id)}" ${F.atr[a.id] === d.id ? 'selected' : ''}>${esc(d.nome || '…')}</option>`).join('')}</select></label>`).join('')}</div></section>` : '<p class="dica">A temporada já começou: dá para renomear divisões e mudar as regras (valem na próxima temporada). Atletas só mudam por acesso e descenso.</p>'}
        <p class="erro" id="l-erro">${esc(erro)}</p><button type="button" class="btn primario wn-go" id="l-salvar" ${erro ? 'disabled' : ''}>${liga ? 'Salvar liga' : 'Criar liga'}</button>`;
    }
    montar();
    c.addEventListener('input', e => { if (e.target.id === 'l-nome') { F.nome = e.target.value; const er = calcErro().erro; c.querySelector('#l-erro').textContent = er; c.querySelector('#l-salvar').disabled = !!er; } });
    c.addEventListener('change', e => {
      const t = e.target, box = t.closest('[data-d]'), d = box && F.divisoes.find(x => x.id === box.dataset.d);
      if (t.dataset.at !== undefined) { if (t.value) F.atr[t.dataset.at] = t.value; else delete F.atr[t.dataset.at]; montar(); return; }
      if (d && t.dataset.f) { const f = t.dataset.f; if (f === 'nome') d.nome = t.value.slice(0, 30); else if (f === 'mataTop') d.mataTop = Number(t.value); else if (f === 'rebaixam') d.rebaixam = Math.max(0, Math.min(10, Math.round(Number(t.value) || 0))); else d[f] = t.checked; montar(); }
    });
    c.addEventListener('click', e => {
      if (e.target.closest('#l-add')) { F.divisoes.push({ id: 'd' + novoId(), nome: 'Divisão ' + (F.divisoes.length + 1), rebaixam: 0, returno: true, mataTop: 0, idaVolta: false }); F.divisoes.forEach((d, k) => { if (k === F.divisoes.length - 2) d.rebaixam = d.rebaixam || 2; }); distribuir('ovr'); montar(); return; }
      const del = e.target.closest('[data-del]'); if (del) { F.divisoes = F.divisoes.filter(d => d.id !== del.dataset.del); distribuir('ovr'); montar(); return; }
      const ds = e.target.closest('[data-dist]'); if (ds) { distribuir(ds.dataset.dist); montar(); return; }
      if (!e.target.closest('#l-salvar')) return;
      const divs = F.divisoes.map(d => ({ id: d.id, nome: d.nome.trim(), rebaixam: d.rebaixam, returno: !!d.returno, mataTop: d.mataTop, idaVolta: !!d.idaVolta, atletas: membrosLivres ? at.filter(a => F.atr[a.id] === d.id).map(a => a.id) : ((liga.divisoes.find(x => x.id === d.id) || {}).atletas || []) }));
      if (wnLigaErro({ divisoes: divs })) return;
      let alvo = liga;
      WStore.update(w => {
        const ls = wnLigas();
        if (!liga) { alvo = { id: 'lg_' + novoId(), nome: F.nome.trim(), criadaEm: new Date().toISOString(), divisoes: divs, temporadas: [] }; ls.push(alvo); wnLigaNovaTemporada(alvo); }
        else {
          if (membrosLivres && t0) { w.torneios = w.torneios.filter(tt => !(tt.liga && tt.liga.id === liga.id && tt.liga.temp === t0.n)); liga.temporadas.pop(); }
          liga.nome = F.nome.trim(); liga.divisoes = divs; if (membrosLivres) wnLigaNovaTemporada(liga);
          else liga.divisoes.forEach(d => { const cc = wnCompDe(t0.comps[d.id]); if (cc) { cc.nome = `${liga.nome} · ${d.nome} · Temporada ${t0.n}`; cc.liga.nome = d.nome; } });
        }
      });
      WStore.salvarAgora(); F.id = null; UI.toast(liga ? 'Liga salva' : 'Liga criada'); location.hash = 'winner-liga-' + alvo.id;
    });
  }

  function wnLigaTela(c, id) {
    const esc = UI.esc, l = wnLiga(id);
    if (!l) { wnListaLigas(c); return; }
    const t = wnLigaAtual(l), fim = wnLigaTerminou(l), nomeAt = i => { const a = wnAtleta(i); return a ? wnFlag(a) + ' ' + esc(wnNome(a)) : 'Atleta removido'; };
    const divNome = i => (l.divisoes.find(d => d.id === i) || {}).nome || '?';
    const prev = fim ? wnLigaMovimentos(l) : null;
    c.innerHTML = `<a class="voltar" href="#winner-ligas">← Ligas</a>${wnTitulo(l.nome, 'Temporada ' + t.n + ' · ' + l.divisoes.length + ' divisões')}
      <div class="linha" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">${fim ? '<button type="button" class="btn primario" id="lg-cont">Continuar liga →</button>' : '<button type="button" class="btn primario" id="lg-sim">Simular temporada</button>'}<a class="btn" href="#winner-liga-editar-${esc(l.id)}">Editar</a><button type="button" class="btn perigo" id="lg-del">Excluir</button></div>
      ${fim ? `<div class="wn-campeao"><span>Fim da temporada ${t.n}</span><strong>${l.divisoes.map(d => { const cc = wnCompDe(t.comps[d.id]); return cc && cc.campeaoId ? `<div style="font-size:18px">🏆 ${esc(d.nome)}: ${nomeAt(cc.campeaoId)}</div>` : ''; }).join('')}</strong></div>
        ${prev.mov.length ? `<section class="secao"><h2>O que acontece ao continuar</h2><div class="lista">${prev.mov.map(m => `<div class="item"><div class="info"><strong>${m.tipo === 'sobe' ? '⬆️' : '⬇️'} ${nomeAt(m.id)}</strong><small>${esc(divNome(m.de))} → ${esc(divNome(m.para))}</small></div></div>`).join('')}</div></section>` : '<p class="dica">Nenhuma troca de divisão nesta temporada.</p>'}` : ''}
      ${l.divisoes.map(d => { const cc = wnCompDe(t.comps[d.id]); if (!cc) return ''; const tab = wnLigaTabela(cc), f = cc.fases[0], tb = tabelaDe(f.jogos, f.grupos[0].clubes, cc.regras), feitos = cc.fases.reduce((x, ff) => x + ff.jogos.filter(j => j.res).length, 0), tot = cc.fases.reduce((x, ff) => x + ff.jogos.length, 0); void tab;
        const k = l.divisoes.indexOf(d), desce = k < l.divisoes.length - 1 ? d.rebaixam : 0, sobe = k > 0 ? l.divisoes[k - 1].rebaixam : 0;
        return `<section class="secao"><div class="linha" style="justify-content:space-between;align-items:center"><h2>${esc(d.nome)}</h2><a class="btn pequeno" href="#winner-torneio-${esc(cc.id)}">Abrir divisão · ${feitos}/${tot}</a></div>
          <div class="wn-tab-wrap"><table class="wn-tab"><thead><tr><th>#</th><th>Atleta</th><th>P</th><th>J</th><th>SG</th></tr></thead><tbody>${tb.map((r, i) => `<tr class="${sobe && i < sobe ? 'sobe' : ''} ${desce && i >= tb.length - desce ? 'desce' : ''}"><td>${i + 1}</td><td><a href="#winner-perfil-${esc(r.id)}">${nomeAt(r.id)}</a></td><td><b>${r.pts}</b></td><td>${r.j}</td><td>${r.sg}</td></tr>`).join('')}</tbody></table></div>
          <p class="dica">${d.mataTop ? 'Top ' + d.mataTop + ' vai ao mata-mata. ' : ''}${sobe ? '⬆️ Os ' + sobe + ' primeiros sobem. ' : ''}${desce ? '⬇️ Os ' + desce + ' últimos descem.' : ''}</p></section>`; }).join('')}
      ${l.temporadas.filter(x => x.status === 'encerrada').length ? `<section class="secao"><h2>Temporadas anteriores</h2><div class="lista">${l.temporadas.filter(x => x.status === 'encerrada').reverse().map(x => `<div class="item"><div class="info"><strong>Temporada ${x.n}</strong><small>${l.divisoes.map(d => x.campeoes[d.id] ? esc(d.nome) + ': ' + (wnAtleta(x.campeoes[d.id]) ? esc(wnNome(wnAtleta(x.campeoes[d.id]))) : '—') : '').filter(Boolean).join(' · ')}</small>${x.mov.length ? `<small>${x.mov.map(m => (m.tipo === 'sobe' ? '⬆️ ' : '⬇️ ') + esc(m.nome)).join(' · ')}</small>` : ''}</div></div>`).join('')}</div></section>` : ''}`;
    c.addEventListener('click', async e => {
      if (e.target.closest('#lg-sim')) {
        l.divisoes.forEach(d => { const cc = wnCompDe(t.comps[d.id]); let g = 0; while (cc && cc.status === 'andamento' && g++ < 3000) { const js = jogosJogaveis(cc); if (!js.length) break; wnSimularJogoTorneio(cc.id, js[0].id); } });
        WStore.salvarAgora(); desenhar(false); return;
      }
      if (e.target.closest('#lg-cont')) {
        let erro = ''; WStore.update(() => { erro = wnLigaContinuar(l); }); WStore.salvarAgora();
        UI.toast(erro ? erro : 'Temporada ' + wnLigaAtual(l).n + ' criada', !!erro); desenhar(false); return;
      }
      if (e.target.closest('#lg-del') && await UI.perguntar('Excluir liga?', 'A liga e os jogos das temporadas serão apagados. As partidas continuam no histórico.', 'Excluir', true)) { WStore.update(w => { w.ligas = wnLigas().filter(x => x.id !== l.id); w.torneios = w.torneios.filter(tt => !(tt.liga && tt.liga.id === l.id)); }); WStore.salvarAgora(); location.hash = 'winner-ligas'; }
    });
  }

  /* ---------- Renniw: início do app ---------- */
  const view = document.getElementById('view');
  function desenhar(rolar) {
    let h = location.hash.slice(1); if (!h.startsWith('winner')) h = 'winner';
    view.innerHTML = '';
    try { telaRenniw(view, h); } catch (e) { console.error(e); view.innerHTML = '<div class="aviso">Algo deu errado ao abrir esta tela. <a href="#winner">Voltar ao início</a></div>'; }
    if (rolar !== false) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', () => desenhar(true));
  desenhar(false);
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('Renniw: modo offline indisponível', e); }); });
}
</script>
